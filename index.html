/* ---------- toast ---------- */
let toastT = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- working together (peer to peer, no accounts) ---------- */
const NET = { peer:null, conns:new Set(), host:false, code:'', state:'off' };
const peers = {};   // id -> {name, color, x, y}
let peerLib = null;
function loadPeer(){
  if (window.Peer) return Promise.resolve();
  if (!peerLib) peerLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = res; s.onerror = () => { peerLib = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return peerLib;
}
const pid = code => 'edutorium-live-' + code.toLowerCase();
function genCode(){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i=0;i<6;i++) s += A[Math.floor(Math.random()*A.length)]; return s; }
function bcast(msg, except){ for (const c of NET.conns) if (c !== except && c.open) { try { c.send(msg); } catch(e){} } }
function myName(){ return ME.name || 'Partner'; }

function leave(silent){
  for (const c of NET.conns) try { c.close(); } catch(e){}
  NET.conns.clear();
  if (NET.peer) try { NET.peer.destroy(); } catch(e){}
  NET.peer = null; NET.host = false; NET.code = ''; NET.state = 'off';
  for (const k in peers) delete peers[k];
  renderCursors(); netStatus();
  if (!silent) toast('You are working on your own now.');
}

async function startHost(){
  leave(true);
  NET.host = true; NET.code = genCode(); NET.state = 'starting'; netStatus();
  try { await loadPeer(); } catch(e){ leave(true); toast('Working together needs an internet connection.'); return; }
  const p = new Peer(pid(NET.code), { debug:0 });
  NET.peer = p;
  p.on('open', () => { NET.state = 'waiting'; netStatus(); if (dlg.open && dlg._together) showTogether(); });
  p.on('connection', c => {
    wire(c);
    c.on('open', () => {
      c.send({ t:'hello', id:ME.id, name:myName(), color:ME.color });
      c.send({ t:'state', items:S.items, bg:S.bg });
      for (const [id, q] of Object.entries(peers)) c.send({ t:'hello', id, name:q.name, color:q.color });
    });
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id'){ startHost(); return; }
    netError(err);
  });
  p.on('disconnected', () => { try { if (!p.destroyed) p.reconnect(); } catch(e){} });
}

async function join(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6){ toast('Codes have 6 letters and numbers.'); return false; }
  leave(true);
  NET.host = false; NET.code = code; NET.state = 'joining'; netStatus();
  try { await loadPeer(); } catch(e){ leave(true); toast('Working together needs an internet connection.'); return; }
  const p = new Peer({ debug:0 });
  NET.peer = p;
  p.on('open', () => {
    const c = p.connect(pid(code), { reliable:true, serialization:'json' });
    wire(c);
    c.on('open', () => c.send({ t:'hello', id:ME.id, name:myName(), color:ME.color }));
  });
  p.on('error', err => {
    if (err.type === 'peer-unavailable'){ leave(true); toast(`No shared board with the code ${code}. Check the code and try again.`); return; }
    netError(err);
  });
}

function netError(err){
  console.warn('Edutorium Live connection:', err && err.type, err);
  const lost = err && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed');
  if (!NET.conns.size){ leave(true); toast(lost ? 'Could not reach the sharing service. Check the internet connection and try again.' : 'Could not connect. Try again.'); }
}

function wire(c){
  c.on('open', () => { NET.conns.add(c); NET.state = 'live'; netStatus(); if (dlg.open && dlg._together) showTogether(); });
  c.on('data', m => onMsg(m, c));
  c.on('close', () => {
    NET.conns.delete(c);
    if (c._who){
      const n = peers[c._who] ? peers[c._who].name : 'Your partner';
      delete peers[c._who]; renderCursors();
      if (NET.host) bcast({ t:'bye', id:c._who });
      toast(`${n} left.`);
    }
    if (!NET.host){ leave(true); toast('The shared board was closed. Your board is still here.'); }
    else { NET.state = NET.conns.size ? 'live' : 'waiting'; netStatus(); }
    if (dlg.open && dlg._together) showTogether();
  });
  c.on('error', err => console.warn('Edutorium Live peer:', err));
}

function onMsg(m, c){
  if (!m || typeof m !== 'object') return;
  switch (m.t){
    case 'set': {
      if (!Array.isArray(m.items)) return;
      const list = m.items.slice(0,3000).map(clean).filter(Boolean);
      // never let a partner's update move a piece I'm dragging right now
      const busy = D && D.mode === 'move' ? new Set(D.ids) : null;
      put(busy ? list.filter(i => !busy.has(i.id)) : list, false);
      m = { t:'set', items:list };
      break;
    }
    case 'del': {
      if (!Array.isArray(m.ids)) return;
      const ids = m.ids.slice(0,3000).map(String);
      drop(ids, false); m = { t:'del', ids };
      break;
    }
    case 'state':
      if (NET.host || !m.items || typeof m.items !== 'object') return;
      loadAll(Object.values(m.items)); undoS = []; redoS = []; undoBtns();
      setBg(m.bg, false);
      toast('Connected. You are both on the same board now.');
      return;
    case 'hello': case 'cur': {
      const id = String(m.id || '').slice(0,40);
      if (!/^[\w-]+$/.test(id) || id === ME.id) return;
      const known = peers[id];
      peers[id] = { name:String(m.name || (known && known.name) || 'Partner').slice(0,20),
                    color:/^#[0-9a-f]{6}$/i.test(m.color) ? m.color : (known ? known.color : '#64748b'),
                    x: m.t === 'cur' ? num(m.x) : (known ? known.x : null), y: m.t === 'cur' ? num(m.y) : (known ? known.y : null) };
      if (m.t === 'hello'){
        if (NET.host && !c._who) c._who = id;
        if (!known) toast(`${peers[id].name} joined.`);
        netStatus(); if (dlg.open && dlg._together) showTogether();
      }
      renderCursors();
      m = { t:m.t, id, name:peers[id].name, color:peers[id].color, x:peers[id].x, y:peers[id].y };
      break;
    }
    case 'bg':
      if (!isBg(m.v)) return;
      setBg(m.v, false); m = { t:'bg', v:m.v };
      break;
    case 'bye': {
      const id = String(m.id || '');
      if (peers[id]){ toast(`${peers[id].name} left.`); delete peers[id]; renderCursors(); netStatus(); }
      break;
    }
    default: return;
  }
  if (NET.host) bcast(m, c);   // the host passes messages on to everyone else
}

let curT = 0;
function sendCursor(e){
  if (!NET.conns.size) return;
  const now = performance.now(); if (now - curT < 60) return; curT = now;
  const p = toB(e);
  bcast({ t:'cur', id:ME.id, name:myName(), color:ME.color, x:Math.round(p.x), y:Math.round(p.y) });
}
function renderCursors(){
  gCur.innerHTML = Object.values(peers).filter(c => c.x !== null).map(c =>
    `<g transform="translate(${c.x} ${c.y})"><path d="M0 0V24L6.5 18 11 28 15.5 26 11 16H19Z" fill="${c.color}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`+
    `<rect x="16" y="24" rx="8" height="26" width="${16 + [...c.name].length*9.5}" fill="${c.color}"/>`+
    `<text x="24" y="42" fill="#fff" font-size="15" font-weight="700">${esc(c.name)}</text></g>`).join('');
}
function netStatus(){
  const b = $('#togetherBtn'), l = $('#togetherLbl'), n = Object.keys(peers).length;
  if (NET.state === 'off'){ l.textContent = 'Work together'; b.classList.add('primary'); }
  else {
    b.classList.remove('primary');
    l.textContent = NET.state === 'live' && n ? `Together · ${n + 1}` :
                    NET.state === 'waiting' ? `Code ${NET.code}` : 'Connecting…';
  }
}

function showTogether(){
  dlg._together = true;
  const names = [`<span class="person"><span class="dot" style="color:${ME.color}"></span>${esc(myName())} (you)</span>`]
    .concat(Object.values(peers).map(p => `<span class="person"><span class="dot" style="color:${p.color}"></span>${esc(p.name)}</span>`)).join('');
  const nameRow = `<label for="myName2">Your name</label><div class="row"><input id="myName2" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off">`+
                  `<button class="btn" value="rename" style="flex:0 0 auto">Save name</button></div>`;
  if (NET.state === 'off'){
    openDlg(`<h2>Work together</h2>
      <p>Two or more people move pieces on the same board at the same time, each on their own device. No accounts needed.</p>
      <label for="myName">Your name</label><input id="myName" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off">
      <div class="two">
        <section><h3>Start a shared board</h3><p>Share the board you have now and get a code for your partner.</p><button class="btn primary" value="host">Start</button></section>
        <section><h3>Join a partner</h3><p>Type your partner's code. Their board will replace yours.</p>
          <input name="code" maxlength="7" placeholder="Code" autocomplete="off" autocapitalize="characters" aria-label="Partner's code" style="text-transform:uppercase;letter-spacing:.12em;font-weight:700">
          <button class="btn" value="join">Join</button></section>
      </div>
      <menu><button class="btn" value="cancel">Close</button></menu>`,
      (v, fd) => {
        ME.name = String(fd.get('name') || '').trim().slice(0,20); ls.set('mml-name', ME.name);
        if (v === 'host'){ startHost(); setTimeout(showTogether, 0); return false; }
        if (v === 'join'){
          const code = String(fd.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
          if (code.length !== 6){ toast('Codes have 6 letters and numbers.'); return false; }
          join(code);
        }
      });
  } else if (NET.host){
    const link = baseUrl(false); link.searchParams.set('join', NET.code);
    openDlg(`<h2>Your shared board</h2>
      ${NET.state === 'starting' ? '<p>Getting a code…</p>' : `<p>Your partner clicks <b>Work together</b> and types this code:</p><div class="code">${NET.code}</div>
      <label for="joinLink">Or send this link</label><div class="row"><input id="joinLink" readonly value="${esc(link.toString())}"><button type="button" class="btn" data-copy="#joinLink" style="flex:0 0 auto">Copy</button></div>`}
      <div class="people">${names}</div>
      <p style="margin-top:10px;font-size:13px">${Object.keys(peers).length ? 'Connected. Everyone sees every move.' : 'Waiting for a partner to join…'} Keep this tab open while you work.</p>
      ${nameRow}
      <menu><button class="btn" value="leave">Stop sharing</button><button class="btn primary" value="cancel">Done</button></menu>`,
      connectedHandler);
  } else {
    openDlg(`<h2>${NET.state === 'live' ? 'Working together' : 'Joining…'}</h2>
      <p>${NET.state === 'live' ? 'You are on a shared board. Everyone sees every move.' : `Connecting to the board ${NET.code}…`}</p>
      <div class="people">${names}</div>${nameRow}
      <menu><button class="btn" value="leave">Leave</button><button class="btn primary" value="cancel">Done</button></menu>`,
      connectedHandler);
  }
}
// while connected, anyone can change the name their partner sees
function connectedHandler(v, fd){
  if (v === 'leave'){ leave(); return; }
  if (v === 'rename'){
    ME.name = String(fd.get('name') || '').trim().slice(0,20); ls.set('mml-name', ME.name);
    bcast({ t:'hello', id:ME.id, name:myName(), color:ME.color });
    toast('Name saved.'); setTimeout(showTogether, 0); return false;
  }
}
// a join link (…?join=CODE) asks for the person's name first
function joinPrompt(code){
  dlg._together = true;
  openDlg(`<h2>Join a shared board</h2>
    <p>You are joining the board <b>${esc(code)}</b>. Your partner's board will replace the one on your screen.</p>
    <label for="joinName">Your name</label><input id="joinName" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off" autofocus>
    <menu><button class="btn primary" value="join">Join</button><button class="btn" value="cancel">Not now</button></menu>`,
    (v, fd) => {
      if (v !== 'join') return;
      ME.name = String(fd.get('name') || '').trim().slice(0,20); ls.set('mml-name', ME.name);
      join(code);
    });
}
$('#togetherBtn').onclick = showTogether;
dlg.addEventListener('close', () => { dlg._together = false; });
window.addEventListener('beforeunload', () => { if (NET.peer) try { NET.peer.destroy(); } catch(e){} });

/* ---------- start up ---------- */
async function boot(){
  if (params.get('embed') === '1') document.body.classList.add('embed');
  buildTray(); syncToggles(); undoBtns(); netStatus(); setView(homeView());
  const h = location.hash.match(/[#&]b=([^&]+)/);
  let started = false;
  if (h){
    try {
      const { items, bg } = await decodeBoard(h[1]);
      S.start = items.map(i => structuredClone(i)); S.startBg = bg;
      loadAll(items); setBg(bg, false); started = true; $('#resetBtn').hidden = false;
    } catch(e){ toast('That board link could not be opened.'); }
  }
  if (!started){
    setBg(ls.get('mml-bg'), false);
    try { const saved = JSON.parse(ls.get('mml-board-v1') || '[]'); if (Array.isArray(saved)) loadAll(saved); } catch(e){}
  }
  const j = String(params.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (j){
    const u = baseUrl(false); history.replaceState(null, '', u.toString() + location.hash);
    joinPrompt(j);
  }
}
boot();
</script>
