}
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

/* ---------- pointer handling ---------- */
function toB(e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function overTray(e){
  const r = tray.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}
let D = null, lastTap = { t:0, id:null }, cascade = 0;

function magnet(dx, dy){
  const T = 10, its = D.ids.map(id => S.items[id]).filter(Boolean);
  if (!its.length || its.some(i => i.k === 'sh' || i.k === 'ink' || i.k === 'txt' || SEED[i.k] || i.k === 'tap' || (i.r || 0) % 90)) return [dx, dy];
  const g = { l:1e9, t:1e9, r:-1e9, b:-1e9 };
  for (const i of its){
    const o = D.orig.get(i.id), b = bbox({ ...i, x:o.x + dx, y:o.y + dy });
    g.l = Math.min(g.l, b.l); g.t = Math.min(g.t, b.t); g.r = Math.max(g.r, b.r); g.b = Math.max(g.b, b.b);
  }
  let bx = null, by = null;
  const mine = new Set(D.ids);
  for (const id in S.items){
    if (mine.has(id)) continue;
    const o = S.items[id];
    if (o.k === 'ink' || o.k === 'txt' || o.k === 'nl' || o.k === 'sh' || o.k === 'tap' || SEED[o.k] || (o.r || 0) % 90) continue;
    const b = bbox(o);
    if (b.t < g.b + T && b.b > g.t - T)
      for (const d of [b.l-g.l, b.r-g.l, b.l-g.r, b.r-g.r]) if (Math.abs(d) <= T && (bx === null || Math.abs(d) < Math.abs(bx))) bx = d;
    if (b.l < g.r + T && b.r > g.l - T)
      for (const d of [b.t-g.t, b.b-g.t, b.t-g.b, b.b-g.b]) if (Math.abs(d) <= T && (by === null || Math.abs(d) < Math.abs(by))) by = d;
  }
  return [dx + (bx || 0), dy + (by || 0)];
}

function startMove(p, ids, pre, fromTray){
  // a Taptinita carries the seeds sitting on it
  ids = withSeeds(ids.map(id => S.items[id])).filter(i => !i.lock).map(i => i.id);
  D = { mode:'move', pre, start:p, ids, fromTray, moved:!!fromTray,
        orig:new Map(ids.map(id => [id, { x:S.items[id].x, y:S.items[id].y }])) };
}

/* ---------- view: pan and zoom over a board with no edges ----------
   V is the part of the board on screen (board units); its height follows the stage's shape.
   Each person has their own view; pieces stay shared. */
const V = { x:0, y:0, w:BW }, ZMIN = 250, ZMAX = 20000;
function stageSize(){ const r = svg.getBoundingClientRect(); return { sw:Math.max(1, r.width), sh:Math.max(1, r.height), r }; }
function viewH(){ const { sw, sh } = stageSize(); return V.w * sh / sw; }
// the starting view: the original 1600 × 900 area, fitted to the screen
function homeView(){ const { sw, sh } = stageSize(), a = sw / sh, w = Math.max(BW, BH*a); return { x:BW/2 - w/2, y:BH/2 - w/a/2, w }; }
function applyView(){
  svg.setAttribute('viewBox', `${V.x} ${V.y} ${V.w} ${viewH()}`);
  $('#zoomPct').textContent = Math.round(homeView().w / V.w * 100) + '%';
}
function setView(v){ Object.assign(V, v); applyView(); }
function viewCenter(){ return { x:V.x + V.w/2, y:V.y + viewH()/2 }; }
function zoomAt(f, px, py){
  const w = Math.min(ZMAX, Math.max(ZMIN, V.w / f)), k = w / V.w;
  V.x = px - (px - V.x)*k; V.y = py - (py - V.y)*k; V.w = w; applyView();
}
function contentBox(){
  const its = Object.values(S.items); if (!its.length) return null;
  let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  for (const it of its){
    const q = bbox(it), extra = it.k === 'nl' && it.hops && it.hops.length ? 190 : 0;   // hops arc above and below their line
    l = Math.min(l, q.l); t = Math.min(t, q.t - extra); r = Math.max(r, q.r); b = Math.max(b, q.b + extra);
  }
  return { l, t, r, b };
}
function fitAll(){
  const c = contentBox(); if (!c) return setView(homeView());
  const { sw, sh } = stageSize(), a = sw / sh, pad = 60;
  const w = Math.min(ZMAX, Math.max(400, c.r - c.l + 2*pad, (c.b - c.t + 2*pad)*a));
  setView({ x:(c.l + c.r)/2 - w/2, y:(c.t + c.b)/2 - w/a/2, w });
}
$('#zoom').addEventListener('click', e => {
  const b = e.target.closest('[data-zoom]'); if (!b) return;
  const z = b.dataset.zoom, c = viewCenter();
  if (z === 'in') zoomAt(1.25, c.x, c.y); else if (z === 'out') zoomAt(1/1.25, c.x, c.y);
  else if (z === 'home') setView(homeView()); else fitAll();
});
// trackpad or wheel scrolls the board; Ctrl + wheel (or a trackpad pinch) zooms at the pointer
svg.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ const p = toB(e); zoomAt(Math.exp(-e.deltaY*0.0025), p.x, p.y); return; }
  const k = V.w / stageSize().sw * (e.deltaMode === 1 ? 30 : 1);
  V.x += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX)*k;
  V.y += (e.shiftKey && !e.deltaX ? 0 : e.deltaY)*k;
  applyView();
}, { passive:false });
new ResizeObserver(() => applyView()).observe($('#stage'));
// two fingers on a touch screen pinch to zoom and drag to pan
const touches = new Map();
function pinchStart(){
  const [a, b] = [...touches.values()], { r } = stageSize();
  const mid = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 }, k = V.w / r.width;
  D = { mode:'pinch', v0:{ ...V }, d0:Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)),
        anchor:{ x:V.x + (mid.x - r.left)*k, y:V.y + (mid.y - r.top)*k } };
}
function pinchMove(){
  const [a, b] = [...touches.values()], { r } = stageSize();
  const mid = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 };
  const w = Math.min(ZMAX, Math.max(ZMIN, D.v0.w * D.d0 / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)))), k = w / r.width;
  setView({ w, x:D.anchor.x - (mid.x - r.left)*k, y:D.anchor.y - (mid.y - r.top)*k });
}
window.addEventListener('pointerup', e => touches.delete(e.pointerId));
window.addEventListener('pointercancel', e => touches.delete(e.pointerId));

svg.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch'){
    touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
    // a second finger turns whatever the first one started (unless it is already dragging a piece) into a pinch
    if (touches.size === 2 && !(D && D.mode === 'move' && D.moved)){
      if (D && D.ghost) D.ghost.remove();
      if (D && D.mode === 'move') commit(D.pre);
      marq.setAttribute('visibility', 'hidden');
      pinchStart(); return;
    }
  }
  if (e.button > 0 || D) return;
  const p = toB(e), g = e.target.closest('#items > g'), it = g && S.items[g.dataset.id];
  if (S.tool === 'pen'){
    D = { mode:'ink', pts:[Math.round(p.x), Math.round(p.y)] };
    liveInk.setAttribute('stroke', S.ink); liveInk.setAttribute('stroke-width', 4); liveInk.setAttribute('d', pathD(D.pts));
    e.preventDefault(); return;
  }
  if (S.tool === 'eraser'){ D = { mode:'erase', pre:begin() }; eraseAt(e); return; }
  if (S.tool === 'text'){
    if (it && it.k === 'txt') textDialog(it); else textDialog(null, p);
    e.preventDefault(); return;
  }
  const hopEl = e.target.closest('[data-hop]'), hopIdx = hopEl ? +hopEl.dataset.hop : null;
  if (S.tool === 'hop'){
    e.preventDefault();
    if (!it || it.k !== 'nl'){ toast('Start a hop on a number line, then drag left or right.'); return; }
    if (it.lock){ toast('This number line is locked. Unlock it to add hops.'); return; }
    D = { mode:'hop', id:it.id, pre:begin(), base:(it.hops || []).slice(), a:hopFrac(it, p), hopIdx };
    return;
  }
  if (it){
    const now = performance.now();
    if (now - lastTap.t < 380 && lastTap.id === it.id){
      const hi = lastTap.hop; lastTap = { t:0, id:null };
      if (it.k === 'nl' && hi !== null && hi === hopIdx && !it.lock) editHop(it, hi); else dbl(it);
      return;
    }
    lastTap = { t:now, id:it.id, hop:hopIdx };
    const dotEl = e.target.closest('[data-box]');
    if (it.k === 'xd' && dotEl && !it.lock){
      // pick up one dot: drop it one box left to explode, one box right to unexplode, off the machine to remove it
      const neg = dotEl.dataset.neg === '1';
      S.sel = new Set([it.id]); dirty(); e.preventDefault();
      D = { mode:'xdot', id:it.id, box:+dotEl.dataset.box, neg, sx:e.clientX, sy:e.clientY, pre:begin(), moved:false,
            ghost:makeGhost(`<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="${neg ? '#ffffff' : DOT_FILL}" stroke="${DOT_EDGE}" stroke-width="${neg ? 3 : 2}"/></svg>`) };
      return;
    }
    if (it.k === 'nl' && hopIdx !== null && !it.lock){
      // pressing on a hop grabs its arrow end (drag the line itself by its line or marks)
      S.sel = new Set([it.id]); dirty();
      const hp0 = it.hops[hopIdx], partEl = e.target.closest('[data-part]');
      D = { mode:'hopend', id:it.id, idx:hopIdx, pre:begin(), moved:false,
            part: partEl ? partEl.dataset.part : 'slide', f0:hopFrac(it, p), a0:hp0.a, b0:hp0.b };
      return;
    }
    // a grouped piece always brings its whole group with it
    const mates = groupOf(it);
    if (e.shiftKey || e.ctrlKey || e.metaKey){
      if (S.sel.has(it.id)){ mates.forEach(id => S.sel.delete(id)); dirty(); return; }
      mates.forEach(id => S.sel.add(id));
    } else if (!S.sel.has(it.id)){ S.sel = new Set(mates); }
    dirty();
    const ids = [...S.sel].filter(id => S.items[id] && !S.items[id].lock);
    if (ids.length) startMove(p, ids, begin(), false);
  } else if (e.shiftKey || e.ctrlKey || e.metaKey){
    // Shift + drag on empty space draws a box to select several pieces
    D = { mode:'marq', x:p.x, y:p.y };
  } else {
    // dragging empty space moves around the board; a plain click there clears the selection
    D = { mode:'pan', sx:e.clientX, sy:e.clientY, v0:{ ...V }, moved:false };
  }
});

function dbl(it){
  if (it.lock) return;
  if (it.k === 'ctr' || AL[it.k]) act(() => { const n = { ...it }; if (n.neg) delete n.neg; else n.neg = true; put([n]); });
  else if (it.k === 'txt' || it.k === 'nl' || it.k === 'xd') editItem(it);
}

function eraseAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('#items > g');
  const it = g && S.items[g.dataset.id];
  if (it && it.k === 'ink' && !it.lock) drop([it.id]);
  const hp = el && el.closest && el.closest('[data-hop]');   // the eraser also rubs out hops
  if (it && it.k === 'nl' && hp && !it.lock) dropHop(it, +hp.dataset.hop);
}

let pend = new Set(), pendT = 0;
function sendLater(ids){ ids.forEach(i => pend.add(i)); if (!pendT) pendT = setTimeout(flush, 45); }
function flush(){
  clearTimeout(pendT); pendT = 0;
  const l = [...pend].map(i => S.items[i]).filter(Boolean); pend.clear();
  if (l.length) bcast({ t:'set', items:l });
}

window.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (e.target.closest && e.target.closest('#stage')) sendCursor(e);
  if (!D) return;
  if (D.mode === 'pinch'){ if (touches.size >= 2) pinchMove(); return; }
  if (D.mode === 'pan'){
    if (!D.moved && Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < 4) return;
    D.moved = true; svg.classList.add('panning');
    const k = D.v0.w / stageSize().sw;
    setView({ x:D.v0.x - (e.clientX - D.sx)*k, y:D.v0.y - (e.clientY - D.sy)*k });
    return;
  }
  if (D.mode === 'newhop' || D.mode === 'newdot' || D.mode === 'xdot'){
    if (!D.moved && Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < 6) return;
    D.moved = true; D.ghost.hidden = false;
    D.ghost.style.left = e.clientX + 'px'; D.ghost.style.top = e.clientY + 'px';
    return;
  }
  if (D.mode === 'hopend'){
    // arc/label: slide the whole hop along the line; start dot: move the start; arrowhead: move the end
    const line = S.items[D.id], hp = line && line.hops && line.hops[D.idx]; if (!hp) return;
    const f = hopFrac(line, toB(e));
    let a = hp.a, b = hp.b;
    if (D.part === 'slide'){
      let dlt = f - D.f0;
      dlt = Math.min(dlt, 1 - Math.max(D.a0, D.b0)); dlt = Math.max(dlt, -Math.min(D.a0, D.b0));   // stay on the line
      a = Math.round((D.a0 + dlt)*10000)/10000; b = Math.round((D.b0 + dlt)*10000)/10000;
    } else if (D.part === 'start') a = f;
    else b = f;
    if (a === b || (a === hp.a && b === hp.b)) return;
    // a label that was worked out keeps being worked out; a typed label keeps its value and gets the right sign
    const auto = hp.t === hopLabel(line, hp.a, hp.b);
    const t = auto ? hopLabel(line, a, b) : (b > a ? '+' : '−') + hp.t.replace(/^[+−-]/, '');
    const hops = line.hops.slice(); hops[D.idx] = { ...hp, a, b, t };
    S.items[D.id] = { ...line, hops }; D.moved = true; dirty();
    return;
  }
  if (D.mode === 'new'){
    if (Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < 6) return;
    const p = toB(e), it = make(tpl(D.pid), p.x, p.y);
    put([it]); S.sel = new Set([it.id]);
    startMove(p, [it.id], D.pre, true);
    return;
  }
  const p = toB(e);
  if (D.mode === 'ink'){
    const n = D.pts.length, x = Math.round(p.x), y = Math.round(p.y);
    if (Math.hypot(x - D.pts[n-2], y - D.pts[n-1]) >= 2){ D.pts.push(x, y); liveInk.setAttribute('d', pathD(D.pts)); }
  } else if (D.mode === 'erase') eraseAt(e);
  else if (D.mode === 'hop'){
    // live preview: draw the hop on the line without sending it yet
    const line = S.items[D.id]; if (!line) return;
    const b = hopFrac(line, p);
    D.b = b;
    S.items[D.id] = { ...line, hops: b !== D.a ? [...D.base, { a:D.a, b, t:hopLabel(line, D.a, b) }] : D.base };
    dirty();
  }
  else if (D.mode === 'marq'){
    const x = Math.min(p.x, D.x), y = Math.min(p.y, D.y);
    marq.setAttribute('x', x); marq.setAttribute('y', y);
    marq.setAttribute('width', Math.abs(p.x - D.x)); marq.setAttribute('height', Math.abs(p.y - D.y));
    marq.setAttribute('visibility', 'visible');
    D.end = p;
  } else if (D.mode === 'move'){
    let dx = p.x - D.start.x, dy = p.y - D.start.y;
    if (!D.moved){
      if (Math.hypot(dx, dy) < 4) return;
      D.moved = true;
      let z = zTop();
      for (const id of D.ids){ const it = S.items[id]; if (it && !MAT.has(it.k)) it.z = z++; }
    }
    [dx, dy] = magnet(dx, dy);
    for (const id of D.ids){ const it = S.items[id], o = D.orig.get(id); if (!it) continue; it.x = o.x + dx; it.y = o.y + dy; }
    tray.classList.toggle('drop', overTray(e));
    dirty(); sendLater(D.ids);
  }
});

function endPointer(e){
  if (!D) return;
  const d = D; D = null;
  tray.classList.remove('drop');
  if (d.mode === 'pinch') return;
  if (d.mode === 'pan'){
    svg.classList.remove('panning');
    if (!d.moved){ S.sel.clear(); dirty(); }
    return;
  }
  if (d.mode === 'newdot'){
    d.ghost.remove();
    if (!d.moved){ toast('Drag the dot into a box of a dot machine.'); return; }
    const m = machineAt(e), box = m ? xdBoxAt(m, toB(e)) : null;
    if (!m || box === null || box < 0){ toast('Drop the dot into a box of a dot machine.'); return; }
    if (m.lock){ toast('This dot machine is locked. Unlock it to add dots.'); return; }
    const n = xdAdd(m, box, d.neg); if (n){ put([n]); commit(d.pre); }
    return;
  }
  if (d.mode === 'xdot'){
    d.ghost.remove();
    if (!d.moved) return;
    const m = S.items[d.id]; if (!m) return;
    const p = toB(e), over = overTray(e) ? null : xdBoxAt(m, p);
    // dropped off the machine (or on the tray): the dot is taken away
    const n = xdMove(m, d.box, over, d.neg); if (n){ put([n]); commit(d.pre); }
    return;
  }
  if (d.mode === 'newhop'){
    d.ghost.remove();
    if (!d.moved){ hopToolHint(); return; }
    const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('#items > g');
    const line = g && S.items[g.dataset.id];
    if (!line || line.k !== 'nl'){ toast('Drop the hop onto a number line.'); return; }
    if (line.lock){ toast('This number line is locked. Unlock it to add hops.'); return; }
    // one mark long on Intervals (a tenth of the line on an open line), starting where it was dropped
    const T = (line.max - line.min)*line.p, step = (!line.open && T > 0 && T <= 240) ? 1/T : 0.1;
    let a = hopFrac(line, toB(e)), b = a + d.sign*step;
    if (b > 1){ b = 1; a = 1 - step; }
    if (b < 0){ b = 0; a = step; }
    a = Math.round(a*10000)/10000; b = Math.round(b*10000)/10000;
    put([{ ...line, hops:[...(line.hops || []), { a, b, t:hopLabel(line, a, b) }] }]); commit(d.pre);
    openHopEditor(line.id, S.items[line.id].hops.length - 1);
    toast('Type a value and press Enter. Drag the arc to slide the hop, the dot to move its start.');
    return;
  }
  if (d.mode === 'hopend'){
    if (d.moved){ put([S.items[d.id]]); commit(d.pre); }
    else openHopEditor(d.id, d.idx);   // a click on a hop opens its value box
    return;
  }
  if (d.mode === 'new'){
    // a click on a tray piece: place it near the middle of the board
    const o = (cascade++ % 8) * 26, c = viewCenter(), it = make(tpl(d.pid), c.x - 80 + o, c.y - 50 + o);
    put([it]); S.sel = new Set([it.id]); commit(d.pre);
    return;
  }
  if (d.mode === 'ink'){
    liveInk.setAttribute('d', '');
    const p = d.pts; if (p.length < 2) return;
    let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity;
    for (let i=0;i<p.length;i+=2){ mx = Math.min(mx, p[i]); Mx = Math.max(Mx, p[i]); my = Math.min(my, p[i+1]); My = Math.max(My, p[i+1]); }
    const it = { id:newId(), k:'ink', c:S.ink, sw:4, pts:p.map((v,i) => i % 2 ? v - my : v - mx),
                 w:Math.max(1, Mx - mx), h:Math.max(1, My - my), x:mx, y:my, r:0, z:zTop() };
    act(() => put([it]));
    return;
  }
  if (d.mode === 'erase'){ commit(d.pre); return; }
  if (d.mode === 'hop'){
    const line = S.items[d.id]; if (!line) return;
    if (d.b === undefined || d.b === d.a){
      S.items[d.id] = { ...line, hops:d.base }; dirty();
      if (d.hopIdx !== null) openHopEditor(d.id, d.hopIdx);   // a tap on a hop opens its value box
      else toast('Drag right for a + hop (above) or left for a − hop (below).');
      return;
    }
    put([S.items[d.id]]); commit(d.pre);
    openHopEditor(d.id, S.items[d.id].hops.length - 1);
    return;
  }
  if (d.mode === 'marq'){
    marq.setAttribute('visibility', 'hidden');
    if (d.end && Math.hypot(d.end.x - d.x, d.end.y - d.y) > 6){
      const r = { l:Math.min(d.x, d.end.x), t:Math.min(d.y, d.end.y), r:Math.max(d.x, d.end.x), b:Math.max(d.y, d.end.y) };
      for (const id in S.items){
        const b = bbox(S.items[id]);
        const hit = MAT.has(S.items[id].k) ? (b.l >= r.l && b.r <= r.r && b.t >= r.t && b.b <= r.b)
                                          : (b.l < r.r && b.r > r.l && b.t < r.b && b.b > r.t);
        if (hit) groupOf(S.items[id]).forEach(m => S.sel.add(m));
      }
    }
    dirty(); return;
  }
  if (d.mode === 'move'){
    if (!d.moved) return;
    if (e && e.type === 'pointerup' && overTray(e)){
      drop(d.ids); relayout(); commit(d.pre); return;
    }
    const changed = [];
    for (const id of d.ids){
      const it = S.items[id]; if (!it) continue;
      // the board has no edges, so pieces can go anywhere
      it.x = Math.round(it.x * 2) / 2;
      it.y = Math.round(it.y * 2) / 2;
      if (it.k === 'ctr') snapToFrame(it);
      if (SEED[it.k] && d.ids.length === 1) snapToTap(it);
      changed.push(it);
    }
    pend.clear(); clearTimeout(pendT); pendT = 0;
    put(changed); relayout(); commit(d.pre);
  }
}

function makeGhost(svgHtml){
  const g = document.createElement('div');
  g.className = 'ghost'; g.innerHTML = svgHtml; g.hidden = true;
  document.body.appendChild(g);
  return g;
}
// the dot machine under a pointer event, if any
function machineAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('#items > g');
  const it = g && S.items[g.dataset.id];

function snapToFrame(c){
  const cx = c.x + 22, cy = c.y + 22;
  for (const id in S.items){
    const f = S.items[id];
    if (f.k !== 'tf' || (f.r || 0) % 180) continue;
    const col = Math.floor((cx - f.x - 10) / 60), row = Math.floor((cy - f.y - 10) / 60);
    if (col >= 0 && col < 5 && row >= 0 && row < 2){ c.x = f.x + 10 + col*60 + 8; c.y = f.y + 10 + row*60 + 8; return; }
  }
}

// a seed dropped near a pozo or the Killa settles into it (up to 9 seeds per hole; relayout() arranges them)
function snapToTap(s){
  const [cx, cy] = centerOf(s), { w, h } = size(s);
  let best = null, bd = SLOT_R + 12;
  for (const t of Object.values(S.items)){
    if (t.k !== 'tap') continue;
    for (const [x, y] of tapSlots(t)){
      const dd = Math.hypot(cx - x, cy - y);
      if (dd >= bd) continue;
      const here = Object.values(S.items).filter(o => o.id !== s.id && SEED[o.k] && Math.hypot(centerOf(o)[0] - x, centerOf(o)[1] - y) < SLOT_R + 4).length;
      if (here < SLOT_MAX){ bd = dd; best = [x, y]; }
    }
  }
  if (best){ s.x = best[0] - w/2; s.y = best[1] - h/2; }
}

window.addEventListener('keydown', e => {
  if (dlg.open || e.target.matches('input,select,textarea')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y'){ e.preventDefault(); redo(); }
  else if (mod && k === 'd'){ e.preventDefault(); doAction('dup'); }
  else if (mod && (k === '=' || k === '+')){ e.preventDefault(); const c = viewCenter(); zoomAt(1.25, c.x, c.y); }
  else if (mod && (k === '-' || k === '_')){ e.preventDefault(); const c = viewCenter(); zoomAt(1/1.25, c.x, c.y); }
  else if (mod && k === '0'){ e.preventDefault(); setView(homeView()); }
  else if (mod && k === 'g'){ e.preventDefault(); doAction(e.shiftKey ? 'ungrp' : 'grp'); }
  else if (mod && k === 'a'){ e.preventDefault(); S.sel = new Set(Object.keys(S.items)); dirty(); }
  else if (mod) return;
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); doAction('del'); }
  else if (k === 'escape'){ S.sel.clear(); dirty(); setTool('select'); }
  else if (k === 'r') doAction(e.shiftKey ? 'rotL' : 'rotR');
  else if (k === 'f') doAction('flip');
  else if (k === 'v') setTool('select');
  else if (k === 'p') setTool('pen');
  else if (k === 'e') setTool('eraser');
  else if (k === 't') setTool('text');
  else if (k === 'h') setTool('hop');
  else if (k.startsWith('arrow') && S.sel.size){
    e.preventDefault();
    const st = e.shiftKey ? 20 : 2, dx = k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, dy = k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0;
    act(() => put(selList().filter(i => !i.lock).map(i => ({ ...i, x:i.x + dx, y:i.y + dy }))));
  }
});

/* ---------- backgrounds (part of the board: saved in links and files, shared with partners) ---------- */
const BGS = [['blank','Blank'],['dots','Dots'],['grid','Square grid'],['coord','Coordinate grid'],['coord1','First quadrant grid'],['iso','Isometric dots']];
const isBg = v => BGS.some(b => b[0] === v);
// every background reaches as far as the board does (BIG in each direction)
function bgSVG(v){
  const full = f => `<rect x="${-BIG}" y="${-BIG}" width="${2*BIG}" height="${2*BIG}" fill="${f}"/>`;
  if (v === 'dots') return full('url(#dots)');
  if (v === 'grid') return full('url(#grid)');
  if (v === 'iso')  return full('url(#iso)');
  if (v !== 'coord' && v !== 'coord1') return '';
  // origin at the middle of the starting view (all four quadrants) or near its bottom-left corner (first quadrant)
  const u = 50, q1 = v === 'coord1', ox = q1 ? 100 : 800, oy = q1 ? 800 : 450, N = 120;
  const grid = q1 ? `<rect x="${ox}" y="${oy - BIG}" width="${BIG}" height="${BIG}" fill="url(#cgrid)"/>` : full('url(#cgrid)');
  const ax = q1 ? `M${ox} ${oy}H${ox + BIG}M${ox} ${oy}V${oy - BIG}` : `M${-BIG} ${oy}H${BIG}M${ox} ${-BIG}V${BIG}`;
  let lab = '';
  for (let i = q1 ? 1 : -N; i <= N; i++){
    if (!i) continue;
    lab += `<text x="${ox + i*u}" y="${oy + 22}" text-anchor="middle">${String(i).replace('-','−')}</text>`;
    lab += `<text x="${ox - 9}" y="${oy - i*u + 5}" text-anchor="end">${String(i).replace('-','−')}</text>`;
  }
  return grid + `<path d="${ax}" stroke="#4b5563" stroke-width="2.5"/>`+
         `<g font-size="15" fill="#4b5563" font-weight="600">${lab}<text x="${ox - 9}" y="${oy + 22}" text-anchor="end">0</text></g>`;
}
function setBg(v, send = true){
  if (!isBg(v)) v = 'dots';
  const changed = S.bg !== v;
  S.bg = v; $('#bg').innerHTML = bgSVG(v); ls.set('mml-bg', v);

}

    `<svg viewBox="0 0 ${BW} ${BH}" aria-hidden="true"><rect width="${BW}" height="${BH}" rx="14" fill="#fcfbf7"/>${bgSVG(v)}</svg><span>${n}</span></button>`).join('')}</div>

function download(blob, name){

async function savePicture(){
  const keep = S.sel; S.sel = new Set(); render();
  const c = svg.cloneNode(true);
  ['#cursors','#liveInk','#marquee','#grpLines'].forEach(s => { const e = c.querySelector(s); if (e) e.remove(); });
  c.removeAttribute('class'); c.removeAttribute('style');
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  // the picture shows everything on the board (or the starting area if the board is empty), not just what is on screen
  const box = contentBox(), pad = 40;
  const area = box ? { x:box.l - pad, y:box.t - pad, w:box.r - box.l + 2*pad, h:box.b - box.t + 2*pad } : { x:0, y:0, w:BW, h:BH };
  const k = Math.min(1.5, 4000 / Math.max(area.w, area.h));
  c.setAttribute('viewBox', `${area.x} ${area.y} ${area.w} ${area.h}`);
  c.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  c.setAttribute('width', area.w); c.setAttribute('height', area.h);
  const paper = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  paper.setAttribute('x', -BIG); paper.setAttribute('y', -BIG); paper.setAttribute('width', 2*BIG); paper.setAttribute('height', 2*BIG); paper.setAttribute('fill', '#fcfbf7');
  c.insertBefore(paper, c.querySelector('#bg'));
  const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  st.textContent = 'text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}';
  c.insertBefore(st, c.firstChild);
  S.sel = keep; render();
  try {
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
    await img.decode();
    const cv = document.createElement('canvas'); cv.width = Math.round(area.w*k); cv.height = Math.round(area.h*k);
    const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => { if (b){ download(b, `edutorium-board-${today()}.png`); toast('Picture saved.'); } else toast('Could not make the picture.'); }, 'image/png');
  } catch(e){ console.warn(e); toast('Could not make the picture.'); }
}

/* board links: the whole board is packed into the part of the link after # */
const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
function compactItems(){
  return Object.values(S.items).map(i => {
    const o = { ...i }; o.x = Math.round(o.x); o.y = Math.round(o.y);
    if (!o.r) delete o.r;
    return o;
  });
}
async function encodeBoard(){
  const json = new TextEncoder().encode(JSON.stringify({ v:1, bg:S.bg, items:compactItems() }));
  if (window.CompressionStream){
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
    return 'z' + b64u(new Uint8Array(buf));
  }
  return 'j' + b64u(json);
}
async function decodeBoard(s){
  let bytes = unb64u(s.slice(1));
  if (s[0] === 'z'){
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    bytes = new Uint8Array(buf);
  }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  return { items:(o.items || []).slice(0,3000).map(clean).filter(Boolean), bg:isBg(o.bg) ? o.bg : 'dots' };
}
function baseUrl(keepJoin){
  const u = new URL(location.href); u.hash = '';
  if (!keepJoin) u.searchParams.delete('join');
  return u;
}

  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- working together (peer to peer, no accounts) ---------- */
const NET = { peer:null, conns:new Set(), host:false, code:'', state:'off' };
const peers = {};   // id -> {name, color, x, y}
let peerLib = null;
function loadPeer(){
  if (window.Peer) return Promise.resolve();
  if (!peerLib) peerLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = res; s.onerror = () => { peerLib = null; rej(new Error('load')); };
    document.head.appendChild(s);
  });
  return peerLib;
}
const pid = code => 'edutorium-live-' + code.toLowerCase();
function genCode(){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i=0;i<6;i++) s += A[Math.floor(Math.random()*A.length)]; return s; }
function bcast(msg, except){ for (const c of NET.conns) if (c !== except && c.open) { try { c.send(msg); } catch(e){} } }
function myName(){ return ME.name || 'Partner'; }

function leave(silent){
  for (const c of NET.conns) try { c.close(); } catch(e){}
  NET.conns.clear();
  if (NET.peer) try { NET.peer.destroy(); } catch(e){}
  NET.peer = null; NET.host = false; NET.code = ''; NET.state = 'off';
  for (const k in peers) delete peers[k];
  renderCursors(); netStatus();
  if (!silent) toast('You are working on your own now.');
}

async function startHost(){
  leave(true);
  NET.host = true; NET.code = genCode(); NET.state = 'starting'; netStatus();
  try { await loadPeer(); } catch(e){ leave(true); toast('Working together needs an internet connection.'); return; }
  const p = new Peer(pid(NET.code), { debug:0 });
  NET.peer = p;
  p.on('open', () => { NET.state = 'waiting'; netStatus(); if (dlg.open && dlg._together) showTogether(); });
  p.on('connection', c => {
    wire(c);
    c.on('open', () => {
      c.send({ t:'hello', id:ME.id, name:myName(), color:ME.color });
      c.send({ t:'state', items:S.items, bg:S.bg });
      for (const [id, q] of Object.entries(peers)) c.send({ t:'hello', id, name:q.name, color:q.color });
    });
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id'){ startHost(); return; }
    netError(err);
  });
  p.on('disconnected', () => { try { if (!p.destroyed) p.reconnect(); } catch(e){} });
}

async function join(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6){ toast('Codes have 6 letters and numbers.'); return false; }
  leave(true);
  NET.host = false; NET.code = code; NET.state = 'joining'; netStatus();
  try { await loadPeer(); } catch(e){ leave(true); toast('Working together needs an internet connection.'); return; }
  const p = new Peer({ debug:0 });
  NET.peer = p;
  p.on('open', () => {
    const c = p.connect(pid(code), { reliable:true, serialization:'json' });
    wire(c);
    c.on('open', () => c.send({ t:'hello', id:ME.id, name:myName(), color:ME.color }));
  });
  p.on('error', err => {
    if (err.type === 'peer-unavailable'){ leave(true); toast(`No shared board with the code ${code}. Check the code and try again.`); return; }
    netError(err);
  });
}

function netError(err){
  console.warn('Edutorium Live connection:', err && err.type, err);
  const lost = err && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed');
  if (!NET.conns.size){ leave(true); toast(lost ? 'Could not reach the sharing service. Check the internet connection and try again.' : 'Could not connect. Try again.'); }
}

function wire(c){
  c.on('open', () => { NET.conns.add(c); NET.state = 'live'; netStatus(); if (dlg.open && dlg._together) showTogether(); });
  c.on('data', m => onMsg(m, c));
  c.on('close', () => {
    NET.conns.delete(c);
    if (c._who){
      const n = peers[c._who] ? peers[c._who].name : 'Your partner';
      delete peers[c._who]; renderCursors();
      if (NET.host) bcast({ t:'bye', id:c._who });
      toast(`${n} left.`);
    }
    if (!NET.host){ leave(true); toast('The shared board was closed. Your board is still here.'); }
    else { NET.state = NET.conns.size ? 'live' : 'waiting'; netStatus(); }
    if (dlg.open && dlg._together) showTogether();
  });
  c.on('error', err => console.warn('Edutorium Live peer:', err));
}

function onMsg(m, c){
  if (!m || typeof m !== 'object') return;
  switch (m.t){
    case 'set': {
      if (!Array.isArray(m.items)) return;
      const list = m.items.slice(0,3000).map(clean).filter(Boolean);
      // never let a partner's update move a piece I'm dragging right now
      const busy = D && D.mode === 'move' ? new Set(D.ids) : null;
      put(busy ? list.filter(i => !busy.has(i.id)) : list, false);
      m = { t:'set', items:list };
      break;
    }
    case 'del': {
      if (!Array.isArray(m.ids)) return;
      const ids = m.ids.slice(0,3000).map(String);
      drop(ids, false); m = { t:'del', ids };
      break;
    }
    case 'state':
      if (NET.host || !m.items || typeof m.items !== 'object') return;
      loadAll(Object.values(m.items)); undoS = []; redoS = []; undoBtns();
      setBg(m.bg, false);
      toast('Connected. You are both on the same board now.');
      return;
    case 'hello': case 'cur': {
      const id = String(m.id || '').slice(0,40);
      if (!/^[\w-]+$/.test(id) || id === ME.id) return;
      const known = peers[id];
      peers[id] = { name:String(m.name || (known && known.name) || 'Partner').slice(0,20),
                    color:/^#[0-9a-f]{6}$/i.test(m.color) ? m.color : (known ? known.color : '#64748b'),
                    x: m.t === 'cur' ? num(m.x) : (known ? known.x : null), y: m.t === 'cur' ? num(m.y) : (known ? known.y : null) };
      if (m.t === 'hello'){
        if (NET.host && !c._who) c._who = id;
        if (!known) toast(`${peers[id].name} joined.`);
        netStatus(); if (dlg.open && dlg._together) showTogether();
      }
      renderCursors();
      m = { t:m.t, id, name:peers[id].name, color:peers[id].color, x:peers[id].x, y:peers[id].y };
      break;
    }
    case 'bg':
      if (!isBg(m.v)) return;
      setBg(m.v, false); m = { t:'bg', v:m.v };
      break;
    case 'bye': {
      const id = String(m.id || '');
      if (peers[id]){ toast(`${peers[id].name} left.`); delete peers[id]; renderCursors(); netStatus(); }
      break;
    }
    default: return;
  }
  if (NET.host) bcast(m, c);   // the host passes messages on to everyone else
}

let curT = 0;
function sendCursor(e){
  if (!NET.conns.size) return;
  const now = performance.now(); if (now - curT < 60) return; curT = now;
  const p = toB(e);
  bcast({ t:'cur', id:ME.id, name:myName(), color:ME.color, x:Math.round(p.x), y:Math.round(p.y) });
}
function renderCursors(){
  gCur.innerHTML = Object.values(peers).filter(c => c.x !== null).map(c =>
    `<g transform="translate(${c.x} ${c.y})"><path d="M0 0V24L6.5 18 11 28 15.5 26 11 16H19Z" fill="${c.color}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`+
    `<rect x="16" y="24" rx="8" height="26" width="${16 + [...c.name].length*9.5}" fill="${c.color}"/>`+
    `<text x="24" y="42" fill="#fff" font-size="15" font-weight="700">${esc(c.name)}</text></g>`).join('');
}
function netStatus(){
  const b = $('#togetherBtn'), l = $('#togetherLbl'), n = Object.keys(peers).length;
  if (NET.state === 'off'){ l.textContent = 'Work together'; b.classList.add('primary'); }
  else {
    b.classList.remove('primary');
    l.textContent = NET.state === 'live' && n ? `Together · ${n + 1}` :
                    NET.state === 'waiting' ? `Code ${NET.code}` : 'Connecting…';
  }
}

function showTogether(){
  dlg._together = true;
  const names = [`<span class="person"><span class="dot" style="color:${ME.color}"></span>${esc(myName())} (you)</span>`]
    .concat(Object.values(peers).map(p => `<span class="person"><span class="dot" style="color:${p.color}"></span>${esc(p.name)}</span>`)).join('');
  const nameRow = `<label for="myName2">Your name</label><div class="row"><input id="myName2" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off">`+
                  `<button class="btn" value="rename" style="flex:0 0 auto">Save name</button></div>`;
  if (NET.state === 'off'){
    openDlg(`<h2>Work together</h2>
      <p>Two or more people move pieces on the same board at the same time, each on their own device. No accounts needed.</p>
      <label for="myName">Your name</label><input id="myName" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off">
      <div class="two">
        <section><h3>Start a shared board</h3><p>Share the board you have now and get a code for your partner.</p><button class="btn primary" value="host">Start</button></section>
        <section><h3>Join a partner</h3><p>Type your partner's code. Their board will replace yours.</p>
          <input name="code" maxlength="7" placeholder="Code" autocomplete="off" autocapitalize="characters" aria-label="Partner's code" style="text-transform:uppercase;letter-spacing:.12em;font-weight:700">
          <button class="btn" value="join">Join</button></section>
      </div>
      <menu><button class="btn" value="cancel">Close</button></menu>`,
      (v, fd) => {
        ME.name = String(fd.get('name') || '').trim().slice(0,20); ls.set('mml-name', ME.name);
        if (v === 'host'){ startHost(); setTimeout(showTogether, 0); return false; }
        if (v === 'join'){
          const code = String(fd.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
          if (code.length !== 6){ toast('Codes have 6 letters and numbers.'); return false; }
          join(code);
        }
      });
  } else if (NET.host){
    const link = baseUrl(false); link.searchParams.set('join', NET.code);
    openDlg(`<h2>Your shared board</h2>
      ${NET.state === 'starting' ? '<p>Getting a code…</p>' : `<p>Your partner clicks <b>Work together</b> and types this code:</p><div class="code">${NET.code}</div>
      <label for="joinLink">Or send this link</label><div class="row"><input id="joinLink" readonly value="${esc(link.toString())}"><button type="button" class="btn" data-copy="#joinLink" style="flex:0 0 auto">Copy</button></div>`}
      <div class="people">${names}</div>
      <p style="margin-top:10px;font-size:13px">${Object.keys(peers).length ? 'Connected. Everyone sees every move.' : 'Waiting for a partner to join…'} Keep this tab open while you work.</p>
      ${nameRow}
      <menu><button class="btn" value="leave">Stop sharing</button><button class="btn primary" value="cancel">Done</button></menu>`,
      connectedHandler);
  } else {
    openDlg(`<h2>${NET.state === 'live' ? 'Working together' : 'Joining…'}</h2>
      <p>${NET.state === 'live' ? 'You are on a shared board. Everyone sees every move.' : `Connecting to the board ${NET.code}…`}</p>
      <div class="people">${names}</div>${nameRow}
      <menu><button class="btn" value="leave">Leave</button><button class="btn primary" value="cancel">Done</button></menu>`,
      connectedHandler);
  }
}
// while connected, anyone can change the name their partner sees
function connectedHandler(v, fd){
  if (v === 'leave'){ leave(); return; }
  if (v === 'rename'){
    ME.name = String(fd.get('name') || '').trim().slice(0,20); ls.set('mml-name', ME.name);
    bcast({ t:'hello', id:ME.id, name:myName(), color:ME.color });
    toast('Name saved.'); setTimeout(showTogether, 0); return false;
  }
}
// a join link (…?join=CODE) asks for the person's name first
function joinPrompt(code){
  dlg._together = true;
  openDlg(`<h2>Join a shared board</h2>
    <p>You are joining the board <b>${esc(code)}</b>. Your partner's board will replace the one on your screen.</p>
    <label for="joinName">Your name</label><input id="joinName" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off" autofocus>
    <menu><button class="btn primary" value="join">Join</button><button class="btn" value="cancel">Not now</button></menu>`,
    (v, fd) => {
      if (v !== 'join') return;
      ME.name = String(fd.get('name') || '').trim().slice(0,20); ls.set('mml-name', ME.name);
      join(code);
    });
}
$('#togetherBtn').onclick = showTogether;
dlg.addEventListener('close', () => { dlg._together = false; });
window.addEventListener('beforeunload', () => { if (NET.peer) try { NET.peer.destroy(); } catch(e){} });

/* ---------- start up ---------- */
async function boot(){
  if (params.get('embed') === '1') document.body.classList.add('embed');
  buildTray(); syncToggles(); undoBtns(); netStatus(); setView(homeView());
  const h = location.hash.match(/[#&]b=([^&]+)/);
  let started = false;
  if (h){
    try {
      const { items, bg } = await decodeBoard(h[1]);
      S.start = items.map(i => structuredClone(i)); S.startBg = bg;
      loadAll(items); setBg(bg, false); started = true; $('#resetBtn').hidden = false;
    } catch(e){ toast('That board link could not be opened.'); }
  }
  if (!started){
    setBg(ls.get('mml-bg'), false);
    try { const saved = JSON.parse(ls.get('mml-board-v1') || '[]'); if (Array.isArray(saved)) loadAll(saved); } catch(e){}
  }
  const j = String(params.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (j){
    const u = baseUrl(false); history.replaceState(null, '', u.toString() + location.hash);
    joinPrompt(j);
  }
}
boot();
</script>
