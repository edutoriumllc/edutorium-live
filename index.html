<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edutorium Live</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --line:#d8dde5; --text:#1b2230; --muted:#5d6878;
  --accent:#2563eb; --accent-ink:#ffffff; --chip:#f3f5f8; --chip-hover:#e8edf5; --stage:#dfe4eb;
  --danger:#c62828; --ok:#15803d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1c2027; --line:#2e343e; --text:#e7eaf0; --muted:#9aa4b2;
    --accent:#6b98ff; --accent-ink:#0b1020; --chip:#252a33; --chip-hover:#2e3440; --stage:#0f1216;
    --danger:#f87171; --ok:#4ade80;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --line:#2e343e; --text:#e7eaf0; --muted:#9aa4b2;
  --accent:#6b98ff; --accent-ink:#0b1020; --chip:#252a33; --chip-hover:#2e3440; --stage:#0f1216;
  --danger:#f87171; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
svg{display:block}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:thin;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:6px}
.brand b{color:var(--accent)}
.brand .logo{display:block;width:37px;height:32px;padding:2px 3px;background:#fff;border-radius:8px;box-sizing:content-box}
.grp{display:flex;gap:2px;padding:2px;background:var(--chip);border-radius:10px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid transparent;border-radius:8px;
  background:transparent;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chip-hover)}
.btn:focus-visible,.tile:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn svg{width:18px;height:18px;flex:none}
.btn.solo{border-color:var(--line);background:var(--panel)}
.btn.solo:hover{background:var(--chip-hover)}
.btn[aria-pressed="true"],.btn.on{background:var(--panel);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08);color:var(--accent)}
.btn:disabled{opacity:.38;cursor:default;background:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
#inks{gap:6px;padding:4px 6px}
#inks[hidden],#penModes[hidden]{display:none}

/* layout */
main{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}
#tray{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 10px 16px;position:relative;z-index:0;scrollbar-width:thin}
#tray.drop{background:color-mix(in srgb,var(--danger) 8%,var(--panel));box-shadow:inset 0 0 0 2px var(--danger)}
#tray details{border-bottom:1px solid var(--line);padding:6px 0 8px}
#tray summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);padding:6px 2px;list-style:none;display:flex;align-items:center;gap:6px}
#tray summary::-webkit-details-marker{display:none}
#tray summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 2px}
#tray details[open] summary::before{transform:rotate(45deg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiles.wall{grid-template-columns:1fr;gap:3px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;padding:6px 2px;border:1px solid transparent;
  border-radius:9px;background:var(--chip);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:11px;color:var(--muted)}
.tile:hover{border-color:var(--accent)}
.tile{min-width:0}
.tile svg{max-width:100%;height:auto}
.tile.wall{min-height:0;padding:3px 4px;align-items:flex-start;background:transparent}
.tile.wall:hover{background:var(--chip)}
.tiles.lines{grid-template-columns:1fr;gap:6px}
.tiles.kak{grid-template-columns:repeat(5,1fr);gap:4px}
.tile.dott{min-height:0;padding:6px 0}
.tile.dott.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile.kkt{min-height:0;padding:5px 0 4px;gap:2px;background:#ffffff;border-color:#e3e6eb;color:#4b5563}
.tile.kkt:hover{border-color:var(--accent)}
.hoprow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pmcols{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;padding:2px 0}
.pmsw{width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.pmsw[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset}
.ctsizes{grid-column:1/-1;display:flex;gap:2px;padding:2px;background:var(--chip);border-radius:10px}
.ctsize{flex:1;height:30px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.ctsize.on{background:var(--panel);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.tile.hopt{min-height:0;padding:6px 4px;background:#fcfbf7;border-color:#e3e6eb;color:#4b5563}
.tile.hopt:hover{border-color:var(--accent)}
.hopedit{position:fixed;z-index:55;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;background:#fff;border:2px solid currentColor;
  border-radius:10px;padding:2px 2px 2px 9px;box-shadow:var(--shadow);font:800 20px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hopedit input{width:76px;height:32px;border:0;outline:0;padding:0 2px;font:inherit;background:transparent;color:inherit}
.hopedit input::placeholder{color:#9ca3af;font-weight:600;font-size:15px}
.hopdel{border:0;background:transparent;color:#6b7280;font:600 20px/1 system-ui;cursor:pointer;padding:4px 7px;border-radius:7px}
.hopdel:hover{background:#f1f3f6;color:#c62828}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);background:#fcfbf7;border-radius:8px;padding:4px;box-shadow:var(--shadow);opacity:.9}
.ghost[hidden]{display:none}
.tile.nlt{min-height:0;padding:8px 4px 6px;background:#fcfbf7;border-color:#e3e6eb;color:#4b5563}
.tile.nlt:hover{border-color:var(--accent)}
.tray-hint{font-size:12px;color:var(--muted);margin:8px 2px 0}

/* the board has no edges: the whole stage is paper, and you pan and zoom around it */
#stage{position:relative;z-index:1;background:#fcfbf7;min-width:0;min-height:0;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#board.hand,#board.hand #items g,#board.hand #items [data-part]{cursor:grab}
#board.panning,#board.panning #items g,#board.panning #items [data-part]{cursor:grabbing}
#zoom{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
#zoom button{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;padding:0 6px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
#zoom button:hover{background:var(--chip-hover)}
#zoom button svg{width:18px;height:18px}
#zoom #zoomPct{min-width:52px}
#board.pen{cursor:crosshair}#board.eraser{cursor:cell}#board.text{cursor:text}#board.hop{cursor:crosshair}
#board.hop #items g{cursor:crosshair}
#items [data-part="slide"]{cursor:grab}
#items [data-part="start"],#items [data-part="end"]{cursor:ew-resize}
#board.hop #items [data-part]{cursor:crosshair}
#items g{cursor:grab}
#board.pen #items g,#board.text #items g{cursor:inherit}
#items g.sel{filter:drop-shadow(0 0 1.5px #2563eb) drop-shadow(0 0 2.5px #2563eb)}
#gsLayer text{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;font-weight:700}
#gsLayer .gsang{fill:#7c3aed;font-size:19px}
#gsLayer .gslen{fill:#1b1f24;font-size:21px}
#gsLayer .gsname{fill:#1b1f24;font-size:22px}
#gsLayer .gsarc{fill:none;stroke:#7c3aed;stroke-width:2.5}
#items g.sel.locked{filter:drop-shadow(0 0 1.5px #d97706) drop-shadow(0 0 2.5px #d97706)}
#items g.locked{cursor:default}

/* selection actions */
#actionbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:4px;max-width:calc(100% - 32px)}
#actionbar[hidden]{display:none}
#actionbar.moved{transform:none}
.barrow{display:flex;gap:4px;align-items:stretch}
.barmain{min-width:0;flex:1}
.bargrip{flex:none;width:14px;border-radius:8px;cursor:grab;touch-action:none;opacity:.55;
  background:radial-gradient(circle,currentColor 1.3px,transparent 1.7px) center/6px 6px;color:var(--muted)}
.bargrip:hover{opacity:1;background-color:var(--chip-hover)}
#actionbar.dragging .bargrip{cursor:grabbing}
.acts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600}
.act:hover{background:var(--chip-hover)}
.act svg{width:18px;height:18px}
.act.danger{color:var(--danger)}
.act.fasw{width:26px;padding:0;justify-content:center}
.act.fasw i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.act.fasw.on i{box-shadow:0 0 0 2px var(--panel),0 0 0 4px currentColor}
.fasplit{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.faacc{position:fixed;perspective:1800px;z-index:40;pointer-events:none}
.faacc .pan{position:relative;height:100%;transform-style:preserve-3d;transform-origin:left center;transition:transform .75s ease-in-out;box-shadow:inset 0 0 0 2px #374151;background:#ffffff}
.faacc .pan .pan{position:absolute;left:100%;top:0;width:100%}
.val{font-size:13px;padding:6px 10px 4px;border-top:1px solid var(--line);margin-top:4px;text-align:center;font-variant-numeric:tabular-nums}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--text);box-shadow:var(--shadow);width:min(540px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,15,25,.45)}
#dlgForm{padding:22px}
dialog h2{margin:0 0 6px;font-size:19px}
dialog h3{margin:0 0 4px;font-size:14px}
dialog p{margin:0 0 12px;color:var(--muted)}
dialog label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
dialog input,dialog select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
dialog input:focus,dialog select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
dialog menu{display:flex;justify-content:flex-end;gap:8px;margin:18px 0 0;padding:0;flex-wrap:wrap}
dialog .btn{border-color:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.two section{background:var(--chip);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.two section p{margin:0;font-size:13px}
.two .btn{justify-content:center;margin-top:auto}
.row{display:flex;gap:8px}
.row>*{flex:1}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.bgopt{display:flex;flex-direction:column;gap:6px;padding:6px;border:2px solid var(--line);border-radius:12px;background:var(--chip);cursor:pointer;font-size:12.5px;font-weight:600}
.bgopt svg{width:100%;height:auto;border-radius:6px}
.bgopt:hover{border-color:var(--accent)}
.bgopt.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.saves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.saveopt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--chip);cursor:pointer}
.saveopt:hover{border-color:var(--accent)}
.saveopt b{font-size:14px}
.saveopt span{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.bgs{grid-template-columns:repeat(2,1fr)}.saves{grid-template-columns:1fr}}
.code{font:700 38px/1.1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.14em;text-align:center;padding:14px;background:var(--chip);border-radius:12px;margin:8px 0 14px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.person{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--chip);font-size:13px;font-weight:600}
.help li{margin:0 0 6px}
.help ul{padding-left:18px;margin:0 0 8px}
.warn{color:var(--danger)!important;font-size:13px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;
  padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

body.embed .brand,body.embed #helpBtn{display:none}

@media (max-width:900px){.lbl{display:none}.btn{padding:0 8px}}
@media (max-width:720px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 168px}
  #tray{order:2;border-right:0;border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  #actionbar{top:8px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* hops: arrow arcs drawn on a number line. Stored on the line as fractions of its length (0 = left end

const NL_X0 = 44, NL_Y = 36, HOP_UP = '#2563eb', HOP_DOWN = '#dc2626';
function hopsSVG(it){
  const x1 = it.w - NL_X0;
  return (it.hops || []).map((hp, i) => {
    const xa = NL_X0 + (x1 - NL_X0)*hp.a, xb = NL_X0 + (x1 - NL_X0)*hp.b, up = hp.b > hp.a;
    const k = Math.min(170, Math.max(50, Math.abs(xb - xa)*.55)), ys = up ? NL_Y - 6 : NL_Y + 6, yc = up ? ys - k : ys + k;
    const peak = up ? ys - k*.75 : ys + k*.75, c = up ? HOP_UP : HOP_DOWN, d = `M${xa} ${ys}C${xa} ${yc} ${xb} ${yc} ${xb} ${ys}`;
    // three grab areas: the arc and label slide the whole hop, the start dot moves the start, the arrowhead moves the end
    return `<g data-hop="${i}"><g data-part="slide"><path d="${d}" fill="none" stroke="transparent" stroke-width="18" pointer-events="stroke"/>`+
           `<path d="${d}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/>`+
           (hp.t ? `<text x="${(xa + xb)/2}" y="${up ? peak - 10 : peak + 31}" font-size="30" font-weight="800" fill="${c}" stroke="#fcfbf7" stroke-width="5" paint-order="stroke" text-anchor="middle">${esc(hp.t)}</text>` : '') + `</g>`+
           `<g data-part="end"><path d="M${xb} ${ys}l-7.5 ${up ? -13 : 13}h15z" fill="${c}"/><circle cx="${xb}" cy="${ys + (up ? -7 : 7)}" r="15" fill="transparent"/></g>`+

/* ---------- FDP grids ---------- */
const pgX = it => (size(it).w - it.cols*PG_C) / 2;   // left edge of the squares (the frame can be wider than a strip)

function fdp(n, N, show, short){

    const g = gcd(n, N);

function pgPaint(i){

// a side label at k/n, written to match the button: a stacked fraction, a decimal or a percent

function amSegments(it){

// − / + on a side: length in wholes (0–10) or parts in each whole (1–12); shading that still fits is kept
function amStep(it, key, d){

// shade or unshade one column or row while dragging; sent to partners when the drag ends

function amCellAt(it, e){

/* ---------- exploding dots ---------- */
const xdBoxX = (it, i) => XD_PAD + (it.n - 1 - i)*(XD_BOX + XD_GAP);
// which box a board point is over: its number, -1 inside the machine but not in a box, null outside the machine
function xdBoxAt(it, p){
  const l = toLocal(it, p), { w, h } = size(it);
  if (l.x < 0 || l.y < 0 || l.x > w || l.y > h) return null;
  if (l.y < XD_HEAD - 6 || l.y > XD_HEAD + XD_BOX + 6) return -1;
  for (let i = 0; i < it.n; i++){ const bx = xdBoxX(it, i); if (l.x >= bx - 6 && l.x <= bx + XD_BOX + 6) return i; }
  return -1;
}
const dotWord = (neg, n) => (neg ? 'anti-dot' : 'dot') + (n === 1 ? '' : 's');
function xdValue(it){ return it.d.reduce((s, [p, n], i) => s + (p - n)*it.base ** i, 0); }
// a dot dragged from box `from` and dropped on box `to` (null = taken off the machine)
function xdMove(it, from, to, neg){
  const d = it.d.map(x => x.slice()), s = neg ? 1 : 0, B = it.base;
  if (to === from || to === -1) return null;
  if (to === null){ d[from][s] -= 1; return { ...it, d }; }
  if (to === from + 1){
    if (d[from][s] < B){ toast(`To explode, this box needs ${B} ${dotWord(neg, 2)}. It has ${d[from][s]}.`); return null; }
    if (d[to][s] + 1 > XD_MAX){ toast('That box is full.'); return null; }
    d[from][s] -= B; d[to][s] += 1;
    toast(`Explode! ${B} ${dotWord(neg, B)} → 1 ${dotWord(neg, 1)} in the box to the left.`);
  } else if (to === from - 1){
    if (d[to][s] + B > XD_MAX){ toast('That box is too full to unexplode into.'); return null; }
    d[from][s] -= 1; d[to][s] += B;
    toast(`Unexplode: 1 ${dotWord(neg, 1)} → ${B} ${dotWord(neg, B)} in the box to the right.`);
  } else { toast('Move dots one box at a time.'); return null; }
  return { ...it, d };
}
function xdAdd(it, box, neg){
  const d = it.d.map(x => x.slice()), s = neg ? 1 : 0;
  if (d[box][s] >= XD_MAX){ toast('That box is full.'); return null; }
  d[box][s] += 1;
  return { ...it, d };
}

// type-in value box that sits on a hop's label: type 10 and Enter gives "+10" (or "−10" for a left hop)

function pathD(p){
  if (p.length < 4) return `M${p[0]} ${p[1]}l.1 0`;
  let d = `M${p[0]} ${p[1]}`;
  for (let i=2; i<p.length-2; i+=2) d += `Q${p[i]} ${p[i+1]} ${(p[i]+p[i+2])/2} ${(p[i+1]+p[i+3])/2}`;
  return d + `L${p[p.length-2]} ${p[p.length-1]}`;
}

/* incoming data (from links or partners) is never trusted: rebuild each piece from known fields */
function clean(o){
  if (!o || typeof o !== 'object') return null;
  const id = String(o.id || '');
  if (!/^[\w-]{1,40}$/.test(id) || !KINDS.has(o.k)) return null;
  const it = { id, k:o.k, x:num(o.x,0,-BIG,BIG), y:num(o.y,0,-BIG,BIG), r:num(o.r,0,-720,720), z:num(o.z,0,-1e7,1e7) };
  if (o.lock) it.lock = true;
  if (typeof o.grp === 'string' && /^[\w-]{1,24}$/.test(o.grp)) it.grp = o.grp;
  if (o.neg && (o.k === 'ctr' || AL[o.k] || o.k === 'ab')) it.neg = true;
  switch (o.k){
    case 'f':   it.n = FDEN.includes(+o.n) ? +o.n : 1; break;
    case 'rod': it.n = Math.round(num(o.n,1,1,10)); break;
    case 'sh':  it.s = Object.prototype.hasOwnProperty.call(SH, o.s) ? o.s : 'tri'; break;
    case 'tg':  it.s = Object.prototype.hasOwnProperty.call(TG, o.s) ? o.s : 'big';
                if (/^#[0-9a-f]{6}$/i.test(o.c || '') && o.c.toUpperCase() !== TG_ORANGE) it.c = o.c; if (o.fl) it.fl = true; break;
    case 'ct':  it.c = Object.prototype.hasOwnProperty.call(CT_COL, o.c) ? o.c : 'r'; it.u = o.u === 'cm' ? 'cm' : 'in'; break;
    case 'pd':  it.c = DOT_COLS.some(d => d[0] === o.c) ? o.c : DOT_COLS[0][0]; it.r = 0; break;
    case 'pm':  it.s = Object.prototype.hasOwnProperty.call(PM, o.s) ? o.s : 'F'; if (o.fl) it.fl = true; break;
    case 'fa':  if (o.cl !== undefined && o.cl !== null && Number.isFinite(+o.cl)) it.cl = num(o.cl, 0.5, 0, 1);   // Compare line
                it.n = Math.round(num(o.n,1,1,12)); it.sh = String(o.sh || '').replace(/[^0-6]/g, '').slice(0, it.n).padEnd(it.n, '0');
                it.how = o.how === 'split' ? 'split' : 'fold'; if (o.br && it.n > 1) it.br = true; it.r = 0; break;
    case 'gs':  it.L = Math.round(num(o.L,4,2,10)); if (o.e) it.e = true;
                if (Array.isArray(o.j) && o.j.length)
                  it.j = o.j.slice(0,40).filter(v => Array.isArray(v) && /^[\w-]{1,40}$/.test(String(v[1])))
                             .map(v => [Math.round(num(v[0],0,0,it.L)), String(v[1]), Math.round(num(v[2],0,0,10))]);
                if (it.j && !it.j.length) delete it.j;
                if (Array.isArray(o.pn) && o.pn.length) it.pn = [...new Set(o.pn.slice(0,11).map(v => Math.round(num(v,0,0,it.L))))];
                break;
    case 'nl':  if (o.open) it.open = true;
                if (Array.isArray(o.hops) && o.hops.length)
                  it.hops = o.hops.slice(0,60).map(h => ({ a:num(h && h.a,0,0,1), b:num(h && h.b,0,0,1), t:String((h && h.t) || '').slice(0,12) }));
                if (Array.isArray(o.pt) && o.pt.length)   // points on the line: where (0–1 along it) and a label
                  it.pt = o.pt.slice(0,60).map(q => ({ a:num(q && q.a,0,0,1), t:String((q && q.t) || '').slice(0,12) }));
                it.min =Math.round(num(o.min,0,-1000,1000)); it.max = Math.round(num(o.max,10,it.min+1,it.min+240));
                it.p = PARTS.includes(+o.p) ? +o.p : 1; it.w = num(o.w,1200,400,1560); break;
    case 'txt': it.text = String(o.text || '').slice(0,80); it.fs = [24,32,48,64].includes(+o.fs) ? +o.fs : 32; it.c = col(o.c); break;
    case 'kk': it.n = Math.round(num(o.n,0,0,19)); it.r = 0; break;   // always upright
    case 'ab': it.t = Object.prototype.hasOwnProperty.call(AB, o.t) ? o.t : '1'; it.o = Math.round(num(o.o,0,0,2)); it.r = 0;
      if (['front','top','side'].includes(o.vw)) it.vw = o.vw;
      if (['w','d','h','b'].includes(o.vr)) it.vr = o.vr;
      break;
    case 'amx': case 'aeq': case 'apr': case 'avol': it.r = 0;
      if (o.k === 'avol' && VOL_VIEWS.some(v => v[0] === o.view) && o.view !== '3d') it.view = o.view; if (o.k === 'amx' && o.lay === 'h') it.lay = 'h'; break;
    case 'am':
      it.xw = Math.round(num(o.xw,0,0,10)); it.xp = Math.round(num(o.xp,1,1,12));
      it.yw = Math.round(num(o.yw,0,0,10)); it.yp = Math.round(num(o.yp,1,1,12));
      if (it.xw*it.xp > AM_MAXN){ it.xw = 0; } if (it.yw*it.yp > AM_MAXN){ it.yw = 0; }
      it.cs = String(o.cs || '').replace(/[^01]/g, '').slice(0, it.xw*it.xp).padEnd(it.xw*it.xp, '0');
      it.rs = String(o.rs || '').replace(/[^01]/g, '').slice(0, it.yw*it.yp).padEnd(it.yw*it.yp, '0');
      it.brush = o.brush === 'h' ? 'h' : 'v';
      it.show = PG_SHOW.includes(o.show) ? o.show : 'frac';
      if (o.sz && +o.sz !== AM_S) it.sz = Math.round(num(o.sz, AM_S, 200, 900));
      break;
    case 'pg':
      it.rows = Math.round(num(o.rows,10,1,12)); it.cols = Math.round(num(o.cols,10,1,12));
      if (o.two) it.two = true;
      it.f = String(o.f || '').replace(/[^0-3]/g, '').slice(0, it.rows*it.cols).padEnd(it.rows*it.cols, '0');
      it.f = it.two ? it.f.replace(/3/g, '1') : it.f.replace(/[1-3]/g, '1');   // a square is one colour only
      it.brush = o.brush === '2' ? '2' : '1';
      it.show = PG_SHOW.includes(o.show) ? o.show : 'pct';
      break;
    case 'xd':
      it.n = Math.round(num(o.n,3,2,6)); it.base = Math.round(num(o.base,10,2,10));
      it.d = [...Array(it.n)].map((_, i) => {
        const v = Array.isArray(o.d) && Array.isArray(o.d[i]) ? o.d[i] : [0,0];
        return [Math.round(num(v[0],0,0,XD_MAX)), Math.round(num(v[1],0,0,XD_MAX))];
      });
      break;
    case 'corn': case 'pea': case 'bean': case 'lupin':
      if (o.sc && +o.sc < 1) it.sc = num(o.sc,1,.2,1); break;
    case 'ink': it.c = col(o.c); it.sw = num(o.sw,4,1,30);
                it.pts = Array.isArray(o.pts) ? o.pts.slice(0,8000).map(v => num(v,0,-5000,5000)) : [0,0];
                if (it.pts.length % 2) it.pts.pop();
                if (it.pts.length < 2) it.pts = [0,0];
                it.w = num(o.w,1,1,6000); it.h = num(o.h,1,1,6000); break;
  }
  return it;
}

/* ---------- templates for the tray ---------- */
function tpl(pid){
  if (BT[pid] || AL[pid]) return { k:pid };
  if (/^a(1|x|x2)n$/.test(pid)) return { k:pid.slice(0,-1), neg:true };
  const m = pid.match(/^(f|rod)(\d+)$/);
  if (m) return { k:m[1], n:+m[2] };
  if (pid === 'ctr') return { k:'ctr' };
  if (pid === 'ctrn') return { k:'ctr', neg:true };
  if (pid === 'tf') return { k:'tf' };
  if (pid === 'tap' || SEED[pid]) return { k:pid };
  if (pid === 'xd') return { k:'xd', n:3, base:10, d:[[0,0],[0,0],[0,0]] };
  const kk = pid.match(/^kk(\d+)$/); if (kk) return { k:'kk', n:+kk[1] };
  if (pid.startsWith('ab-')) return { k:'ab', t:pid.slice(3), o:0 };
  if (MATS[pid]) return { k:pid };
  if (pid === 'am') return { k:'am', xw:0, xp:1, yw:0, yp:1, cs:'', rs:'', brush:'v', show:'frac' };   // starts blank
  if (pid === 'pg100') return { k:'pg', rows:10, cols:10, f:'0'.repeat(100), show:'pct' };
  if (pid === 'pg10') return { k:'pg', rows:10, cols:1, f:'0'.repeat(10), show:'pct' };
  if (pid.startsWith('sh-')) return { k:'sh', s:pid.slice(3) };
  if (pid.startsWith('tg-')) return { k:'tg', s:pid.slice(3) };
  if (pid.startsWith('pm-')) return { k:'pm', s:pid.slice(3) };
  if (pid === 'fa') return { k:'fa', n:1, sh:'0', how:'fold' };   // one whole, not folded yet
  const gsm = pid.match(/^gs(\d+)$/); if (gsm) return S.gsEnds ? { k:'gs', L:+gsm[1], e:true } : { k:'gs', L:+gsm[1] };   // holes at the ends only, if chosen in the tray
  if (pid.startsWith('pd:')) return { k:'pd', c:pid.slice(3) };
  if (pid.startsWith('ct-')){ const [, c, u] = pid.split('-'); return { k:'ct', c, u:u || S.ctu }; }   // the size chosen in the tray
  if (pid === 'nl') return { k:'nl', min:0, max:10, p:1, w:1200 };
  if (pid === 'nlo') return { k:'nl', open:true, min:0, max:10, p:1, w:1200 };
  return null;
}

function buildTray(){
  const alias = { shapes:'patternblocks', percent:'fdp', taptinita:'taptanita' };   // old link names still work
  const want = (params.get('tray') || '').split(',').map(s => alias[s.trim()] || s.trim()).filter(Boolean);
  let html = '';
  for (const g of GROUPS){
    if (want.length && !want.includes(g.id)) continue;
    html += `<details open><summary>${g.name}</summary><div class="tiles${g.wall?' wall':''}${g.line || g.xd ? ' lines' : ''}${g.id === 'dotpatterns' ? ' kak' : ''}">`;
    let hopRow = '';
    if (g.id === 'pentominoes'){
      // each pentomino its own color, or all one color (with a choice of color)
      const sw = (v, t) => `<button type="button" class="ctsize${S.pmOne === v ? ' on' : ''}" data-pmone="${v ? 1 : 0}" aria-pressed="${S.pmOne === v}">${t}</button>`;
      html += `<div class="ctsizes" role="group" aria-label="Pentomino colors">${sw(false, 'Separate colors')}${sw(true, 'One color')}</div>`;
      if (S.pmOne) html += `<div class="pmcols">${PM_SWATCHES.map(c => `<button type="button" class="pmsw" data-pmcol="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${c.toLowerCase() === S.pmCol.toLowerCase()}"></button>`).join('')}</div>`;
    }
    if (g.id === 'geostrips'){
      // new strips join at every hole, or only at their two ends
      const sw = (v, t) => `<button type="button" class="ctsize${S.gsEnds === v ? ' on' : ''}" data-gse="${v ? 1 : 0}" aria-pressed="${S.gsEnds === v}">${t}</button>`;
      html += `<div class="ctsizes" role="group" aria-label="Geo strip holes">${sw(false, 'Every hole')}${sw(true, 'Ends only')}</div>`;
    }
    if (g.id === 'colortiles'){
      // one size at a time: 1 inch or 1 cm squares
      const sw = (u, t) => `<button type="button" class="ctsize${S.ctu === u ? ' on' : ''}" data-ctu="${u}" aria-pressed="${S.ctu === u}">${t}</button>`;
      html += `<div class="ctsizes" role="group" aria-label="Color tile size">${sw('in', '1 inch')}${sw('cm', '1 cm')}</div>`;
    }
    if (g.kak){
      // 5 across × 4 down: each row adds a five (0–4, 5–9, 10–14, 15–19)
      html = html.replace(/<div class="tiles">$/, '<div class="tiles kak">');
      for (const [pid, label] of g.tiles){
        const n = +pid.slice(2);
        html += `<button type="button" class="tile kkt" data-pid="${pid}"${S.labels ? ` title="${label}"` : ''} aria-label="Add Kaktovik numeral ${n}">`+
                `<svg width="30" height="44" viewBox="6 4 68 104" aria-hidden="true"><path d="${kkPath(n)}" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`+
                (S.labels ? `<span>${n}</span>` : '') + `</button>`;
      }
      html += `</div></details>`;
      continue;
    }
    for (const [pid, label] of g.tiles){
      if (g.xd){
        if (pid === 'xd'){
          const it = { id:'t', x:0, y:0, r:0, ...tpl('xd') }, { w, h } = size(it), sc = 186 / w;
          html += `<button type="button" class="tile nlt" data-pid="xd"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="Add ${esc(label)}">`+
                  `<svg width="${(w*sc).toFixed(1)}" height="${(h*sc).toFixed(1)}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${inner(it)}</svg>`+
                  (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
        } else {
          const neg = pid === 'dotn';
          hopRow += `<button type="button" class="tile hopt" data-pid="${pid}"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="${esc(label)}: drag into a box of a dot machine">`+
                    `<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="12" fill="${neg ? '#ffffff' : DOT_FILL}" stroke="${DOT_EDGE}" stroke-width="${neg ? 3.5 : 2.5}"/></svg>`+
                    (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
        }
        continue;
      }
      if (g.line){
        // number lines and hops get their own bold previews on a light card, so they read in light and dark mode
        if (pid === 'hopp' || pid === 'hopm'){
          // small side-by-side tiles: just the arc with its arrow and sign
          const up = pid === 'hopp', c = up ? HOP_UP : HOP_DOWN;
          const pic = `<svg width="64" height="40" viewBox="0 0 64 40" aria-hidden="true">`+
            (up ? `<path d="M8 34C8 7 42 7 42 32" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M42 35l-6-10h12z" fill="${c}"/>`+
                  `<text x="55" y="20" font-size="22" font-weight="800" fill="${c}" text-anchor="middle">+</text>`
                : `<path d="M42 6C42 33 8 33 8 8" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M8 5l-6 10h12z" fill="${c}"/>`+
                  `<text x="55" y="27" font-size="22" font-weight="800" fill="${c}" text-anchor="middle">−</text>`) + `</svg>`;
          hopRow += `<button type="button" class="tile hopt" data-pid="${pid}"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="${esc(label)}: drag onto a number line">`+
                    pic + (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
          continue;
        }
        if (pid === 'nlpt'){
          const pic = `<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 26H38" stroke="#1f2937" stroke-width="2.2"/><circle cx="20" cy="26" r="7.5" fill="${PT_C}" stroke="#ffffff" stroke-width="2"/></svg>`;
          hopRow += `<button type="button" class="tile hopt" data-pid="nlpt"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="${esc(label)}: drag onto a number line">`+
                    pic + (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
          continue;
        }
        const ticks = pid === 'nlo' ? '' : [...Array(11)].map((_, i) => `M${20 + i*14} 11V23`).join('');
        const pic = `<svg width="180" height="34" viewBox="0 0 180 34" aria-hidden="true"><path d="M10 17H170${ticks}" stroke="#1f2937" stroke-width="2.2" fill="none"/>`+
                    `<path d="M4 17l9-5.5v11zM176 17l-9-5.5v11z" fill="#1f2937"/></svg>`;
        html += `<button type="button" class="tile nlt" data-pid="${pid}"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="Add ${esc(label)}">`+
                pic + (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
        continue;
      }
      if (pid.startsWith('pd:')){
        // a dot of one color: drag it onto the board (or click it to drop one in the middle)
        const c = pid.slice(3);
        html += `<button type="button" class="tile dott" data-pid="${pid}" title="${esc(label)} dot" aria-label="Add a ${esc(label)} dot">`+
                `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="${c}" stroke="${mix(c,'#000000',.35)}" stroke-width="2"/></svg>` +
                (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
        continue;
      }
      if (pid === 'tgset'){
        // the whole tangram square, each piece outlined
        const body = TG_SET.map(([, t]) => `<polygon points="${t.map(q => q.join(',')).join(' ')}" fill="${TG_ORANGE}" stroke="${mix(TG_ORANGE,'#000000',.45)}" stroke-width="5" stroke-linejoin="round"/>`).join('');
        html += `<button type="button" class="tile" data-pid="tgset"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="Add all 7 tangram pieces as a square">`+
                `<svg width="50" height="50" viewBox="-4 -4 248 248" aria-hidden="true">${body}</svg>` + (S.labels ? `<span>${esc(label)}</span>` : '') + `</button>`;
        continue;
      }
      const it = { id:'t', x:0, y:0, r:0, ...tpl(pid) }, { w, h } = size(it);
      const sc = g.wall ? 186/g.wall : g.id === 'colortiles' ? (S.ctu === 'cm' ? 1 : 0.62) : Math.min(64/w, 46/h, 1.3);   // color tiles: inch tiles look bigger than cm tiles
      // names under tiles and numbers on pieces only show when Names is on
      html += `<button type="button" class="tile${g.wall?' wall':''}" data-pid="${pid}"${S.labels ? ` title="${esc(label)}"` : ''} aria-label="Add ${esc(label)}">`+
              `<svg width="${(w*sc+3).toFixed(1)}" height="${(h*sc+3).toFixed(1)}" viewBox="-1.5 -1.5 ${w+3} ${h+3}" aria-hidden="true">${inner(it)}</svg>`+
              (g.wall || !S.labels ? '' : `<span>${esc(label)}</span>`) + `</button>`;
    }
    if (hopRow) html += `<div class="hoprow">${hopRow}</div>`;
    html += `</div></details>`;
  }
  html += `<p class="tray-hint">Drag pieces onto the board. Drag them back here to remove them.</p>`;
  tray.innerHTML = html;
}

/* ---------- state changes, undo, saving ---------- */
let undoS = [], redoS = [];
const begin = () => structuredClone(S.items);
function commit(pre){
  const ch = [];
  for (const id of new Set([...Object.keys(pre), ...Object.keys(S.items)])){
    const a = pre[id] || null, b = S.items[id] || null;
    if (JSON.stringify(a) !== JSON.stringify(b)) ch.push([id, a, b && structuredClone(b)]);
  }
  if (ch.length){ undoS.push(ch); if (undoS.length > 80) undoS.shift(); redoS = []; }
  undoBtns();
}
function act(fn){ const pre = begin(); fn(); commit(pre); }
function replay(ch, back){
  const sets = [], dels = [];
  for (const [id, a, b] of ch){ const v = back ? a : b; if (v) sets.push(structuredClone(v)); else dels.push(id); }
  put(sets); drop(dels);
}
function undo(){ const ch = undoS.pop(); if (!ch) return; replay(ch, true); redoS.push(ch); undoBtns(); }
function redo(){ const ch = redoS.pop(); if (!ch) return; replay(ch, false); undoS.push(ch); undoBtns(); }
function undoBtns(){ $('#undoBtn').disabled = !undoS.length; $('#redoBtn').disabled = !redoS.length; }

let saveT = 0;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => ls.set('mml-board-v1', JSON.stringify(Object.values(S.items))), 400); }

function put(list, send = true){
  if (!list.length) return;
  for (const it of list) S.items[it.id] = it;
  if (send) bcast({ t:'set', items:list });
  dirty(); save();
}
function drop(ids, send = true){
  ids = ids.filter(id => S.items[id]);
  if (!ids.length) return;
  for (const id of ids){ delete S.items[id]; S.sel.delete(id); }
  if (send) bcast({ t:'del', ids });
  dirty(); save();
}
function loadAll(list){
  S.items = {}; S.sel.clear();
  for (const o of list.slice(0,3000)){ const it = clean(o); if (it) S.items[it.id] = it; }
  dirty(); save();
}

const newId = () => ME.id.slice(1,5) + rid();
function zTop(){ let m = 0; for (const id in S.items) m = Math.max(m, S.items[id].z || 0); return m + 1; }
function zBottom(){ let m = 0; for (const id in S.items) m = Math.min(m, S.items[id].z || 0); return m - 1; }
function make(t, cx, cy){
  const it = { id:newId(), ...t, x:0, y:0, r:0, z:0 };
  const { w, h } = size(it);
  it.x = Math.round(cx - w/2); it.y = Math.round(cy - h/2);
  it.z = MAT.has(it.k) ? zBottom() : zTop();
  if (SEED[it.k]) it.r = Math.round(Math.random()*50 - 25);   // seeds lie at a slight tilt, like in Taptanita
  return it;

  for (const m of list.filter(i => i.k === 'xd')){

    const digits = m.d.slice().reverse().map(([p, n]) => String(p - n).replace('-','−')).join(' | ');

function doAction(a){
  const list = selList();
  if (!list.length) return;
  const free = list.filter(i => !i.lock);
  if (a === 'rotL' || a === 'rotR'){
    // the Taptanita stays upright so its seeds stay in their pozos; Kaktovik numerals stay upright so they read correctly
    const turn = free.filter(i => !NO_TURN.has(i.k));
    // pattern blocks turn 30° at a time, or 60° on the isometric dots (so their corners land on dots again)
    const dir = a === 'rotL' ? -1 : 1, onlyShapes = turn.every(i => i.k === 'sh'), iso = isoOn() && turn.some(i => i.k === 'sh');
    // tangram pieces turn 45° at a time (their sides meet at 45° and 90°)
    const onlyTg = turn.every(i => i.k === 'tg');
    const onlyGs = turn.length && turn.every(i => i.k === 'gs');   // geo strip shapes turn 15° at a time
    const step = (onlyGs ? 15 : onlyTg ? 45 : onlyShapes ? (iso ? 60 : 30) : 90) * dir, norm = r => ((r % 360) + 360) % 360;
    const turnTo = i => iso && i.k === 'sh'
      ? norm(dir > 0 ? Math.floor((i.r || 0)/60)*60 + 60 : Math.ceil((i.r || 0)/60)*60 - 60)   // next 60° mark
      : norm((i.r || 0) + step);
    let out;
    if (turn.length > 1){
      // several pieces (a group) turn together around their shared centre
      let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
      turn.forEach(i => { const q = bbox(i); l = Math.min(l, q.l); t = Math.min(t, q.t); r = Math.max(r, q.r); b = Math.max(b, q.b); });
      const gx = (l + r)/2, gy = (t + b)/2, ang = step*Math.PI/180, cs = Math.cos(ang), sn = Math.sin(ang);
      out = turn.map(i => {
        const { w, h } = size(i), dx = i.x + w/2 - gx, dy = i.y + h/2 - gy;
        return { ...i, x:gx + dx*cs - dy*sn - w/2, y:gy + dx*sn + dy*cs - h/2, r:turnTo(i) };
      });
      if (!iso && !onlyGs) out = out.map(i => ({ ...i, x:Math.round(i.x*2)/2, y:Math.round(i.y*2)/2 }));
    } else out = turn.map(i => ({ ...i, r:turnTo(i) }));
    out = isoSnap(out);   // back onto the dots (does nothing on other backgrounds)
    if (onlyGs) out = gsSnapList(out);   // geo strips too (inch grid or isometric dots)
    if (tgClash(out)){ toast('That turn would make tangram pieces overlap. Move the piece to an open space first.'); return; }
    act(() => put(out));
  } else if (a === 'flip'){
    const out = free.filter(i => i.k === 'ctr' || AL[i.k] || i.k === 'ab' || i.k === 'tg' || i.k === 'pm').map(i => {
      const n = { ...i };
      if (i.k === 'tg' || i.k === 'pm'){ if (n.fl) delete n.fl; else n.fl = true; return n; }   // tangram pieces and pentominoes turn over (a mirror image)
      if (n.neg) delete n.neg; else n.neg = true; return n;

    tgColorDialog(free.filter(i => i.k === 'tg'));

          const pn = (s.pn || []).filter(q => !inG(id, q)); if (pn.length) n.pn = pn; else delete n.pn; return n; }));
        else { const s = S.items[gh[0]]; put([{ ...s, pn:[...(s.pn || []), gh[1]] }]); }
        toast(pinned ? 'Unpinned.' : 'Pinned: this point stays still while you bend the shape.');
      }
    });
    bar._sig = ''; dirty();
  }
}

/* ---------- Taptanita: seeds belong to the Taptanita they sit on ---------- */
const SLOT_R = 19*TAP, SLOT_MAX = 9, SEED_ORDER = { lupin:0, pea:1, bean:2, corn:3 };
const tapSlots = t => [...TAP_POZOS, TAP_KILLA].map(([px,py]) => [t.x + px*TAP, t.y + py*TAP]);
const centerOf = it => { const { w, h } = size(it); return [it.x + w/2, it.y + h/2]; };
function onTap(t, s){
  const [cx, cy] = centerOf(s), lx = (cx - t.x)/TAP, ly = (cy - t.y)/TAP;
  return Math.hypot(lx - 110, ly - 66) < 64 || Math.hypot(lx - 110, ly - 208) < 102;
}
function tapUnder(s){ return Object.values(S.items).find(t => t.k === 'tap' && onTap(t, s)) || null; }
// a list plus every seed sitting on a Taptanita in it
function withSeeds(list){
  const out = [...list], have = new Set(list.map(i => i.id));
  for (const t of list) if (t.k === 'tap')
    for (const s of Object.values(S.items)) if (SEED[s.k] && !have.has(s.id) && onTap(t, s)){ out.push(s); have.add(s.id); }
  return out;
}
// seeds sharing a pozo (or the Killa) all shrink by the same amount and spread out so they all show
function slotLayout(n){
  if (n <= 1) return { sc:1, offs:[[0,0]] };
  if (n === 2) return { sc:.6, offs:[[-13,0],[13,0]] };
  if (n === 3) return { sc:.52, offs:[[0,-13],[-13,9],[13,9]] };
  if (n === 4) return { sc:.46, offs:[[-12,-11],[12,-11],[-12,11],[12,11]] };
  const offs = []; for (let i=0;i<n;i++) offs.push([((i % 3) - 1)*19, (Math.floor(i/3) - 1)*17]);
  return { sc:.36, offs };
}
function relayout(){
  const seeds = Object.values(S.items).filter(s => SEED[s.k]), placed = new Set(), changed = [];
  const fit = (s, cx, cy, sc) => {
    const W = SEED[s.k].w*sc, H = SEED[s.k].h*sc, x = Math.round((cx - W/2)*10)/10, y = Math.round((cy - H/2)*10)/10;
    if (Math.abs(s.x - x) < .05 && Math.abs(s.y - y) < .05 && (s.sc || 1) === sc) return;
    const n = { ...s, x, y }; if (sc === 1) delete n.sc; else n.sc = sc;
    changed.push(n);
  };
  for (const t of Object.values(S.items)){
    if (t.k !== 'tap') continue;
    for (const [cx, cy] of tapSlots(t)){
      const inn = seeds.filter(s => !placed.has(s.id) && Math.hypot(centerOf(s)[0] - cx, centerOf(s)[1] - cy) < SLOT_R + 4)
                       .sort((a,b) => SEED_ORDER[a.k] - SEED_ORDER[b.k] || (a.id < b.id ? -1 : 1));
      if (!inn.length) continue;
      const L = slotLayout(Math.min(inn.length, SLOT_MAX));
      inn.forEach((s, i) => { placed.add(s.id); const [dx, dy] = L.offs[Math.min(i, L.offs.length - 1)]; fit(s, cx + dx, cy + dy, L.sc); });
    }
  }
  // seeds that left a pozo grow back to full size
  for (const s of seeds) if (!placed.has(s.id) && s.sc){ const [cx, cy] = centerOf(s); fit(s, cx, cy, 1); }
  if (changed.length) put(changed);
}

function breakApart(list){
  const made = [];
  act(() => {
    let z = zTop();
    for (const it of list){
      const low = DOWN[it.k]; if (!low) continue;
      const b = bbox(it), out = [], tap = SEED[it.k] ? tapUnder(it) : null;
      for (let i=0;i<10;i++){
        let x, y;
        // on a Taptanita, the 10 smaller seeds fill the 9 pozos and the Killa, as in the app
        if (tap){ const [cx, cy] = tapSlots(tap)[i]; x = cx - SEED[low].w/2; y = cy - SEED[low].h/2; }
        else if (SEED[it.k]){ const cw = SEED[low].w + 8; x = b.l + (i % 5)*cw; y = b.t + Math.floor(i/5)*(SEED[low].h + 8); }
        else if (it.k === 'b10'){
          const flat = (it.r || 0) % 180 === 90;
          x = b.l + (flat ? i*23 : 0); y = b.t + (flat ? 0 : i*23);
        } else if (it.k === 'b100'){ x = b.l + i*24; y = b.t; }
        else { x = b.l + i*12; y = b.t + i*12; }
        out.push({ id:newId(), k:low, x, y, r:SEED[low] ? Math.round(Math.random()*50 - 25) : 0, z:z++ });
      }
      drop([it.id]); put(out); made.push(...out.map(o => o.id));
    }
    relayout();
  });
  S.sel = new Set(made); dirty();
}
function groupTen(list){
  const made = [];
  act(() => {
    for (const k of GROUPABLE){
      const arr = list.filter(i => i.k === k).sort((a,b) => a.y - b.y || a.x - b.x);
      while (arr.length >= 10){
        const ten = arr.splice(0,10);
        let l = Math.min(...ten.map(t => bbox(t).l)), t = Math.min(...ten.map(t => bbox(t).t));
        if (SEED[k]){ const [cx, cy] = centerOf(ten[0]); l = cx - SEED[UP[k]].w/2; t = cy - SEED[UP[k]].h/2; }
        drop(ten.map(i => i.id));
        const n = { id:newId(), k:UP[k], x:l, y:t, r:SEED[k] ? Math.round(Math.random()*50 - 25) : 0, z:zTop() };
        put([n]); made.push(n.id);
      }
      made.push(...arr.map(i => i.id));
    }
    relayout();
  });
  S.sel = new Set(made.filter(id => S.items[id])); dirty();
}
function zeroPairs(list){
  let removed = 0;
  act(() => {
    for (const k of ['ctr','a1','ax','ax2']){
      const pos = list.filter(i => i.k === k && !i.neg), neg = list.filter(i => i.k === k && i.neg);
      const n = Math.min(pos.length, neg.length);
      drop([...pos.slice(0,n), ...neg.slice(0,n)].map(i => i.id));
      removed += n;
    }
    for (const t of Object.keys(AB)){   // 3D blocks: a block and its negative of the same kind cancel
      const pos = list.filter(i => i.k === 'ab' && i.t === t && !i.neg), neg = list.filter(i => i.k === 'ab' && i.t === t && i.neg);
      const n = Math.min(pos.length, neg.length);
      drop([...pos.slice(0,n), ...neg.slice(0,n)].map(i => i.id));
      removed += n;
    }
    // in a dot machine, a dot and an anti-dot in the same box cancel out
    for (const m of list.filter(i => i.k === 'xd')){
      const d = m.d.map(([p, n]) => { const z = Math.min(p, n); removed += z; return [p - z, n - z]; });
      put([{ ...m, d }]);
    }
  });
  toast(`Removed ${removed} zero pair${removed === 1 ? '' : 's'}.`);
}

/* Dots: colored dots (pieces from the side menu) for growing dot patterns.
   The spot a dot settles on when dropped or moved: the nearest background dot, square centre or grid crossing. */
// dots are the size of counters (44), so the spots are spaced at least 50 apart and still sit on the background's pattern
const DOT_D = 44;
function dotSpot(x, y){
  const bg = S.bg;
  const lat = (step, off) => [Math.round((x - off)/step)*step + off, Math.round((y - off)/step)*step + off];
  if (bg === 'iso'){
    // every other isometric dot (60 apart, still a triangle pattern)
    let best = null; const j0 = Math.round(y/(2*ISO_H));
    for (let j = j0 - 1; j <= j0 + 1; j++){
      const off = ((j % 2) + 2) % 2 ? 30 : 0, i = Math.round((x - off)/60), dx = i*60 + off, dy = j*2*ISO_H, d = Math.hypot(x - dx, y - dy);
      if (!best || d < best[2]) best = [dx, dy, d];
    }
    return [best[0], best[1]];
  }
  if (bg === 'gridin') return lat(60, 30);                 // the middle of each inch square
  if (bg === 'gridcm') return lat(120/2.54, 60/2.54);      // every 2 cm (a dot covers about 2 cm)
  if (bg === 'coord' || bg === 'coord1') return lat(50, 0); // grid crossings
  if (bg === 'dots') return lat(80, 20);                   // every other background dot
  return lat(50, 25);                                      // blank board
}

function toB(e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function overTray(e){
  const r = tray.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}
let D = null, lastTap = { t:0, id:null }, cascade = 0;

function magnet(dx, dy){
  const T = 10, its = D.ids.map(id => S.items[id]).filter(Boolean);
  if (!its.length || its.some(i => i.k === 'sh' || i.k === 'ink' || i.k === 'txt' || SEED[i.k] || i.k === 'tap' || i.k === 'gs' || (i.r || 0) % 90)) return [dx, dy];
  const g = { l:1e9, t:1e9, r:-1e9, b:-1e9 };
  for (const i of its){
    const o = D.orig.get(i.id), b = bbox({ ...i, x:o.x + dx, y:o.y + dy });
    g.l = Math.min(g.l, b.l); g.t = Math.min(g.t, b.t); g.r = Math.max(g.r, b.r); g.b = Math.max(g.b, b.b);
  }
  let bx = null, by = null;
  const mine = new Set(D.ids);
  for (const id in S.items){
    if (mine.has(id)) continue;
    const o = S.items[id];
    if (o.k === 'ink' || o.k === 'txt' || o.k === 'nl' || o.k === 'sh' || o.k === 'tap' || o.k === 'gs' || SEED[o.k] || (o.r || 0) % 90) continue;
    const b = bbox(o);
    if (b.t < g.b + T && b.b > g.t - T)
      for (const d of [b.l-g.l, b.r-g.l, b.l-g.r, b.r-g.r]) if (Math.abs(d) <= T && (bx === null || Math.abs(d) < Math.abs(bx))) bx = d;
    if (b.l < g.r + T && b.r > g.l - T)
      for (const d of [b.t-g.t, b.b-g.t, b.t-g.b, b.b-g.b]) if (Math.abs(d) <= T && (by === null || Math.abs(d) < Math.abs(by))) by = d;
  }
  return [dx + (bx || 0), dy + (by || 0)];
}

function startMove(p, ids, pre, fromTray){
  // a Taptanita carries the seeds sitting on it
  ids = withSeeds(ids.map(id => S.items[id])).filter(i => !i.lock).map(i => i.id);
  // a mat carries the pieces sitting on it
  for (const id of [...ids]){
    const m = S.items[id]; if (!m || !MATS[m.k]) continue;
    for (const o of Object.values(S.items)){
      if (o.id === m.id || MAT.has(o.k) || o.lock || ids.includes(o.id)) continue;
      const [cx, cy] = centerOf(o);
      const ms = matSize(m);
      if (cx >= m.x && cx <= m.x + ms.w && cy >= m.y && cy <= m.y + ms.h) ids.push(o.id);
    }
  }
  D = { mode:'move', pre, start:p, ids, fromTray, moved:!!fromTray,
        orig:new Map(ids.map(id => [id, { x:S.items[id].x, y:S.items[id].y }])) };
}

/* ---------- view: pan and zoom over a board with no edges ----------
   V is the part of the board on screen (board units); its height follows the stage's shape.
   Each person has their own view; pieces stay shared. */
const V = { x:0, y:0, w:BW }, ZMIN = 250, ZMAX = 20000;
function stageSize(){ const r = svg.getBoundingClientRect(); return { sw:Math.max(1, r.width), sh:Math.max(1, r.height), r }; }
function viewH(){ const { sw, sh } = stageSize(); return V.w * sh / sw; }
// the starting view: the original 1600 × 900 area, fitted to the screen
function homeView(){ const { sw, sh } = stageSize(), a = sw / sh, w = Math.max(BW, BH*a); return { x:BW/2 - w/2, y:BH/2 - w/a/2, w }; }
function applyView(){
  svg.setAttribute('viewBox', `${V.x} ${V.y} ${V.w} ${viewH()}`);

      for (const id of D.ids){ const it = S.items[id]; if (it && !MAT.has(it.k)) it.z = z++; }
    }
    [dx, dy] = magnet(dx, dy);
    // geo strips click onto another strip's hole, or onto the dots / inch grid
    const gsn = gsMoveSnap(dx, dy, e.altKey); if (gsn){ dx += gsn.dx; dy += gsn.dy; }
    if (isoOn()){
      // pattern blocks click onto the isometric dots as they move
      const sh = isoShift(D.ids.map(id => S.items[id]).filter(i => i && i.k === 'sh')
                             .map(i => ({ ...i, x:D.orig.get(i.id).x + dx, y:D.orig.get(i.id).y + dy })));
      if (sh){ dx += sh.dx; dy += sh.dy; }
    } else {
      // color tiles click onto an inch or centimeter grid as they move
      const moving = k => D.ids.map(id => S.items[id]).filter(i => i && k(i)).map(i => ({ ...i, x:D.orig.get(i.id).x + dx, y:D.orig.get(i.id).y + dy }));
      const gs = gridShift(moving(i => i.k === 'ct' || i.k === 'pm')) || dotShift(moving(i => i.k === 'pd'));   // dots click onto their spots too
      if (gs){ dx += gs.dx; dy += gs.dy; }
    }
    for (const id of D.ids){ const it = S.items[id], o = D.orig.get(id); if (!it) continue; it.x = o.x + dx; it.y = o.y + dy; }
    tray.classList.toggle('drop', overTray(e));
    dirty(); sendLater(D.ids);
  }
});

function endPointer(e){
  if (!D) return;
  const d = D; D = null;
  tray.classList.remove('drop');
  if (d.mode === 'pinch') return;
  if (d.mode === 'pan'){ svg.classList.remove('panning'); return; }
  if (d.mode === 'newdot'){
    d.ghost.remove();
    if (!d.moved){ toast('Drag the dot into a box of a dot machine.'); return; }
    const m = machineAt(e), box = m ? xdBoxAt(m, toB(e)) : null;
    if (!m || box === null || box < 0){ toast('Drop the dot into a box of a dot machine.'); return; }
    if (m.lock){ toast('This dot machine is locked. Unlock it to add dots.'); return; }
    const n = xdAdd(m, box, d.neg); if (n){ put([n]); commit(d.pre); }
    return;
  }
  if (d.mode === 'xdot'){
    d.ghost.remove();
    if (!d.moved) return;
    const m = S.items[d.id]; if (!m) return;
    const p = toB(e), over = overTray(e) ? null : xdBoxAt(m, p);
    // dropped off the machine (or on the tray): the dot is taken away
    const n = xdMove(m, d.box, over, d.neg); if (n){ put([n]); commit(d.pre); }
    return;
  }
  if (d.mode === 'newhop'){
    d.ghost.remove();
    if (!d.moved){ hopToolHint(); return; }
    const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('#items > g');
    const line = g && S.items[g.dataset.id];
    if (!line || line.k !== 'nl'){ toast('Drop the hop onto a number line.'); return; }
    if (line.lock){ toast('This number line is locked. Unlock it to add hops.'); return; }
    // one mark long on Intervals (a tenth of the line on an open line), starting where it was dropped
    const T = (line.max - line.min)*line.p, step = (!line.open && T > 0 && T <= 240) ? 1/T : 0.1;
    let a = hopFrac(line, toB(e)), b = a + d.sign*step;
    if (b > 1){ b = 1; a = 1 - step; }
    if (b < 0){ b = 0; a = step; }
    a = Math.round(a*10000)/10000; b = Math.round(b*10000)/10000;
    put([{ ...line, hops:[...(line.hops || []), { a, b, t:hopLabel(line, a, b) }] }]); commit(d.pre);
    openHopEditor(line.id, S.items[line.id].hops.length - 1);
    toast('Type a value and press Enter. Drag the arc to slide the hop, the dot to move its start.');
    return;
  }
  if (d.mode === 'newpt'){
    d.ghost.remove();
    if (!d.moved){ toast('Drag the point onto a number line. Drag it again to add more points.'); return; }
    const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('#items > g');
    const line = g && S.items[g.dataset.id];
    if (!line || line.k !== 'nl'){ toast('Drop the point onto a number line.'); return; }
    if (line.lock){ toast('This number line is locked. Unlock it to add points.'); return; }
    const a = hopFrac(line, toB(e));
    put([{ ...line, pt:[...(line.pt || []), { a, t:'' }] }]); commit(d.pre);   // starts with no label
    toast('Drag the point to slide it along the line. Click it to add a label or delete it.');
    return;
  }
  if (d.mode === 'ptmove'){
    if (d.moved){ put([S.items[d.id]]); commit(d.pre); } else editPt(S.items[d.id], d.idx);   // a click opens its label box
    return;
  }
  if (d.mode === 'amsize'){ if (d.moved){ put([S.items[d.id]]); commit(d.pre); } return; }
  if (d.mode === 'gsbend'){ gsEndBend(d); return; }
  if (d.mode === 'hopend'){
    if (d.moved){ put([S.items[d.id]]); commit(d.pre); }
    else openHopEditor(d.id, d.idx);   // a click on a hop opens its value box
    return;
  }
  if (d.mode === 'new'){
    // a click on a tray piece: place it near the middle of the board
    if (d.pid === 'tgset'){ const c = viewCenter(); placeTgSet(c.x, c.y); commit(d.pre); return; }
    const o = (cascade++ % 8) * 26, c = viewCenter(), it = tgClear(bgSnap([make(tpl(d.pid), c.x - 80 + o, c.y - 50 + o)]))[0];   // pentominoes land clear of others
    put([it]); S.sel = new Set([it.id]); commit(d.pre);
    return;
  }
  if (d.mode === 'ink'){
    liveInk.setAttribute('d', '');
    const p = d.pts; if (p.length < 2) return;
    let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity;
    for (let i=0;i<p.length;i+=2){ mx = Math.min(mx, p[i]); Mx = Math.max(Mx, p[i]); my = Math.min(my, p[i+1]); My = Math.max(My, p[i+1]); }
    const it = { id:newId(), k:'ink', c:S.ink, sw:4, pts:p.map((v,i) => i % 2 ? v - my : v - mx),
                 w:Math.max(1, Mx - mx), h:Math.max(1, My - my), x:mx, y:my, r:0, z:zTop() };
    act(() => put([it]));
    return;
  }
  if (d.mode === 'erase'){ commit(d.pre); return; }
  if (d.mode === 'hop'){
    const line = S.items[d.id]; if (!line) return;
    if (d.b === undefined || d.b === d.a){
      S.items[d.id] = { ...line, hops:d.base }; dirty();
      if (d.hopIdx !== null) openHopEditor(d.id, d.hopIdx);   // a tap on a hop opens its value box
      else toast('Drag right for a + hop (above) or left for a − hop (below).');
      return;
    }
    put([S.items[d.id]]); commit(d.pre);
    openHopEditor(d.id, S.items[d.id].hops.length - 1);
    return;
  }
  if (d.mode === 'marq'){
    marq.setAttribute('visibility', 'hidden');
    if (d.end && Math.hypot(d.end.x - d.x, d.end.y - d.y) > 6){
      const r = { l:Math.min(d.x, d.end.x), t:Math.min(d.y, d.end.y), r:Math.max(d.x, d.end.x), b:Math.max(d.y, d.end.y) };
      for (const id in S.items){
        const b = bbox(S.items[id]);
        const hit = MAT.has(S.items[id].k) ? (b.l >= r.l && b.r <= r.r && b.t >= r.t && b.b <= r.b)
                                          : (b.l < r.r && b.r > r.l && b.t < r.b && b.b > r.t);
        if (hit) groupOf(S.items[id]).forEach(m => S.sel.add(m));
      }
    }
    dirty(); return;
  }
  if (d.mode === 'facl'){ if (d.moved){ put(Object.values(S.items).filter(i => i.k === 'fa' && i.cl !== undefined)); commit(d.pre); } return; }
  if (d.mode === 'paint' || d.mode === 'ampaint' || d.mode === 'fapaint'){ if (S.items[d.id]) put([S.items[d.id]]); commit(d.pre); return; }
  if (d.mode === 'move'){
    if (!d.moved){ if (d.pgBtn) pgCycle(d.pgBtn); return; }
    if (e && e.type === 'pointerup' && overTray(e)){
      drop(d.ids); gsUnlink(); relayout(); prodLayout(); volLayout(); commit(d.pre); return;
    }
    let changed = [];
    for (const id of d.ids){
      const it = S.items[id]; if (!it) continue;
      // the board has no edges, so pieces can go anywhere (blocks snapped to dots keep their exact place; geo strips keep exact places)
      if (it.k !== 'gs' && !(isoOn() && d.ids.some(id => S.items[id] && S.items[id].k === 'sh')) && !(gridStep() && d.ids.some(id => S.items[id] && (S.items[id].k === 'ct' || S.items[id].k === 'pm'))) && !d.ids.some(id => S.items[id] && S.items[id].k === 'pd')){
        it.x = Math.round(it.x * 2) / 2;
        it.y = Math.round(it.y * 2) / 2;
      }
      if (it.k === 'ctr') snapToFrame(it);
      if (SEED[it.k] && d.ids.length === 1) snapToTap(it);
      changed.push(it);
    }
    if (changed.some(i => i.k === 'gs')){
      // geo strips dropped on another strip's hole join there (and at any other holes that now meet)
      const touched = gsJoinAfterMove(d.ids, d.gsJoin);
      changed = changed.map(i => S.items[i.id]).concat(touched.filter(id => !d.ids.includes(id)).map(id => S.items[id]));
      if (d.gsJoin || touched.length) toast('Joined.');
    }
    if (changed.some(i => NO_OVERLAP.has(i.k))){
      // tangram pieces fit corner to corner and never overlap: a piece dropped on another goes back
      const s = tgCornerSnap(changed); if (s) changed.forEach(i => { i.x += s.dx; i.y += s.dy; });
      if (tgClash(changed)){
        if (d.fromTray) tgClear(changed);
        else { changed.forEach(i => { const o = d.orig.get(i.id); if (o){ i.x = o.x; i.y = o.y; } }); toast(changed.some(i => i.k === 'pm') ? 'Pentominoes can’t overlap, so the piece went back.' : 'Tangram pieces can’t overlap, so the piece went back.'); }
      }
    }
    pend.clear(); clearTimeout(pendT); pendT = 0;
    // pieces carried along with a Volume mat keep their jobs; pieces dragged on their own are re-sorted by where they landed
    const carried = d.ids.some(id => S.items[id] && S.items[id].k === 'avol');
    put(changed); relayout(); prodLayout(); volLayout(new Set(carried ? [] : d.ids)); commit(d.pre);
  }
}

function makeGhost(svgHtml){
  const g = document.createElement('div');
  g.className = 'ghost'; g.innerHTML = svgHtml; g.hidden = true;
  document.body.appendChild(g);
  return g;
}
// the dot machine under a pointer event, if any
function machineAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY), g = el && el.closest && el.closest('#items > g');
  const it = g && S.items[g.dataset.id];
  return it && it.k === 'xd' ? it : null;
}
// hops only come from the side menu: a click on a hop tile explains how to use it
function hopToolHint(){
  toast('Drag the hop onto a number line: + hops go right (above), − hops go left (below).');
}

function snapToFrame(c){
  const cx = c.x + 22, cy = c.y + 22;
  for (const id in S.items){
    const f = S.items[id];
    if (f.k !== 'tf' || (f.r || 0) % 180) continue;
    const col = Math.floor((cx - f.x - 10) / 60), row = Math.floor((cy - f.y - 10) / 60);
    if (col >= 0 && col < 5 && row >= 0 && row < 2){ c.x = f.x + 10 + col*60 + 8; c.y = f.y + 10 + row*60 + 8; return; }
  }
}

// a seed dropped near a pozo or the Killa settles into it (up to 9 seeds per hole; relayout() arranges them)
function snapToTap(s){
  const [cx, cy] = centerOf(s), { w, h } = size(s);
  let best = null, bd = SLOT_R + 12;
  for (const t of Object.values(S.items)){
    if (t.k !== 'tap') continue;
    for (const [x, y] of tapSlots(t)){
      const dd = Math.hypot(cx - x, cy - y);
      if (dd >= bd) continue;
      const here = Object.values(S.items).filter(o => o.id !== s.id && SEED[o.k] && Math.hypot(centerOf(o)[0] - x, centerOf(o)[1] - y) < SLOT_R + 4).length;
      if (here < SLOT_MAX){ bd = dd; best = [x, y]; }
    }
  }
  if (best){ s.x = best[0] - w/2; s.y = best[1] - h/2; }
}

  const po = e.target.closest('[data-pmone]'), pc = e.target.closest('[data-pmcol]');

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (dlg.open || (e.target.matches && e.target.matches('input,select,textarea'))) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y'){ e.preventDefault(); redo(); }
  else if (mod && k === 'd'){ e.preventDefault(); doAction('dup'); }
  else if (mod && (k === '=' || k === '+')){ e.preventDefault(); const c = viewCenter(); zoomAt(1.25, c.x, c.y); }
  else if (mod && (k === '-' || k === '_')){ e.preventDefault(); const c = viewCenter(); zoomAt(1/1.25, c.x, c.y); }
  else if (mod && k === '0'){ e.preventDefault(); setView(homeView()); }
  else if (mod && k === 'g'){ e.preventDefault(); doAction(e.shiftKey ? 'ungrp' : 'grp'); }
  else if (mod && k === 'a'){ e.preventDefault(); S.sel = new Set(Object.keys(S.items)); dirty(); }
  else if (mod) return;
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); doAction('del'); }
  else if (k === 'escape'){ S.sel.clear(); dirty(); setTool('select'); }
  else if (k === 'r') doAction(e.shiftKey ? 'rotL' : 'rotR');
  else if (k === 'f') doAction('flip');
  else if (k === 'v') setTool('select');
  else if (k === 'p') setTool('pen');
  else if (k === 'e') setTool('eraser');
  else if (k === 't') setTool('text');
  else if (k.startsWith('arrow') && S.sel.size){
    e.preventDefault();
    const st = e.shiftKey ? 20 : 2, dx = k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, dy = k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0;
    act(() => put(selList().filter(i => !i.lock).map(i => ({ ...i, x:i.x + dx, y:i.y + dy }))));
  }
});

/* ---------- backgrounds (part of the board: saved in links and files, shared with partners) ---------- */
const BGS = [['blank','Blank'],['dots','Dots'],['gridin','Inch grid'],['gridcm','Centimeter grid'],['coord','Coordinate grid'],['coord1','First quadrant grid'],['iso','Isometric dots']];
const isBg = v => v === 'grid' || BGS.some(b => b[0] === v);   // 'grid' = old links and files (opens as the inch grid)
// how far apart the lines of a square grid background are (0 when the background is not a square grid)
const gridStep = () => S.bg === 'gridin' || S.bg === 'grid' ? 60 : S.bg === 'gridcm' ? 60/2.54 : 0;
// every background reaches as far as the board does (BIG in each direction)
function bgSVG(v){
  const full = f => `<rect x="${-BIG}" y="${-BIG}" width="${2*BIG}" height="${2*BIG}" fill="${f}"/>`;
  if (v === 'dots') return full('url(#dots)');
  if (v === 'gridin') return full('url(#gridin)');
  if (v === 'gridcm') return full('url(#gridcm)');
  if (v === 'iso')  return full('url(#iso)');
  if (v !== 'coord' && v !== 'coord1') return '';
  // origin at the middle of the starting view (all four quadrants) or near its bottom-left corner (first quadrant)
  const u = 50, q1 = v === 'coord1', ox = q1 ? 100 : 800, oy = q1 ? 800 : 450, N = 120;
  const grid = q1 ? `<rect x="${ox}" y="${oy - BIG}" width="${BIG}" height="${BIG}" fill="url(#cgrid)"/>` : full('url(#cgrid)');
  const ax = q1 ? `M${ox} ${oy}H${ox + BIG}M${ox} ${oy}V${oy - BIG}` : `M${-BIG} ${oy}H${BIG}M${ox} ${-BIG}V${BIG}`;
  let lab = '';
  for (let i = q1 ? 1 : -N; i <= N; i++){
    if (!i) continue;

  }

// a close-up of each background for the Background box (the real ones are too fine to see when shrunk)
function bgPreview(v){
  const W = 160, H = 90, line = '#9aa6b5', ink = '#475569';
  let s = '';
  const vlines = (step, x0 = 0, y0 = 0) => { let d = ''; for (let x = x0 % step; x <= W; x += step) d += `M${x} 0V${H}`; for (let y = y0 % step; y <= H; y += step) d += `M0 ${y}H${W}`; return d; };
  const chip = t => `<rect x="${W - 46}" y="${H - 22}" width="40" height="16" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="${W - 26}" y="${H - 10}" font-size="10" font-weight="700" fill="${ink}" text-anchor="middle">${t}</text>`;
  if (v === 'dots'){ for (let x = 10; x < W; x += 14) for (let y = 9; y < H; y += 14) s += `<circle cx="${x}" cy="${y}" r="1.8" fill="${line}"/>`; }
  else if (v === 'gridin') s = `<path d="${vlines(30)}" stroke="${line}" stroke-width="1.2"/>` + chip('1 in');
  else if (v === 'gridcm') s = `<path d="${vlines(30/2.54)}" stroke="${line}" stroke-width=".8"/>` + chip('1 cm');
  else if (v === 'coord' || v === 'coord1'){
    // grid with the x and y axes: crossing in the middle (four quadrants) or at the bottom left (first quadrant)
    const ox = v === 'coord' ? 80 : 14, oy = v === 'coord' ? 45 : 78, st = 11;
    s = `<path d="${vlines(st, ox, oy)}" stroke="#cbd5e1" stroke-width=".8"/>` +
        `<path d="M${v === 'coord' ? 0 : ox} ${oy}H${W}M${ox} ${v === 'coord' ? H : oy}V0" stroke="${ink}" stroke-width="1.6"/>`;
    for (let i = 1; i <= 4; i++) s += `<text x="${ox + i*st*2}" y="${oy + 10}" font-size="7" fill="${ink}" text-anchor="middle">${i*2}</text><text x="${ox - 3}" y="${oy - i*st*2 + 2.5}" font-size="7" fill="${ink}" text-anchor="end">${i*2}</text>`;
  }
  else if (v === 'iso'){ const dx = 14, dy = 14*Math.sqrt(3)/2; let r = 0; for (let y = 8; y < H; y += dy, r++) for (let x = (r % 2 ? dx/2 : 0) + 6; x < W; x += dx) s += `<circle cx="${x}" cy="${y}" r="1.8" fill="${line}"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect width="${W}" height="${H}" rx="8" fill="#fcfbf7"/>${s}</svg>`;
}

async function savePicture(){

  const box = contentBox(), pad = 40;

  const k = Math.min(1.5, 4000 / Math.max(area.w, area.h));

const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
function compactItems(){
  return Object.values(S.items).map(i => {
    const o = { ...i }; o.x = Math.round(o.x); o.y = Math.round(o.y);
    if (!o.r) delete o.r;
    return o;
  });
}
async function encodeBoard(){
  const json = new TextEncoder().encode(JSON.stringify({ v:1, bg:S.bg, items:compactItems() }));
  if (window.CompressionStream){
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
    return 'z' + b64u(new Uint8Array(buf));
  }
  return 'j' + b64u(json);
}
async function decodeBoard(s){
  let bytes = unb64u(s.slice(1));
  if (s[0] === 'z'){
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    bytes = new Uint8Array(buf);
  }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  return { items:(o.items || []).slice(0,3000).map(clean).filter(Boolean), bg:isBg(o.bg) ? o.bg : 'dots' };
}
